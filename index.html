<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>寻道 · 文字修仙</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Ma+Shan+Zheng&display=swap');
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{font-family:'Noto Serif SC',serif;background:radial-gradient(ellipse at 20% 0%,#1a1428 0%,transparent 50%),radial-gradient(ellipse at 80% 100%,#0d1a20 0%,transparent 50%),#050308;background-attachment:fixed;color:#e8d8b0;min-height:100vh;overflow-x:hidden}
body{padding:10px 10px 18px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.title{font-family:'Ma Shan Zheng',cursive;font-size:26px;text-align:center;color:#c9a96e;letter-spacing:10px;text-shadow:0 0 24px rgba(201,169,110,.35);padding:4px 0 0}
.title .sub{display:block;font-family:'Noto Serif SC',serif;font-size:10px;color:#6b5d3c;letter-spacing:4px;margin-top:2px}
.panel{background:linear-gradient(135deg,rgba(40,30,50,.55),rgba(20,15,30,.75));border:1px solid rgba(201,169,110,.18);border-radius:4px;padding:10px 12px}
.realm-display{text-align:center;font-family:'Ma Shan Zheng',cursive;font-size:21px;color:#d4af37;letter-spacing:5px;text-shadow:0 0 12px rgba(212,175,55,.3);padding:2px 0}
.realm-sub{text-align:center;font-size:11px;color:#8b7d5c;letter-spacing:2px}
.bars{margin-top:6px}
.bar-row{display:flex;align-items:center;gap:6px;margin:3px 0;font-size:11px}
.bar-row .label{width:32px;color:#8b7d5c;flex-shrink:0}
.bar-row .nums{width:90px;text-align:right;color:#b89e6e;font-size:10px;flex-shrink:0}
.bar-bg{flex:1;height:6px;background:rgba(0,0,0,.5);border:1px solid rgba(201,169,110,.15);border-radius:2px;overflow:hidden}
.bar-fill{height:100%;transition:width .5s}
.bar-hp{background:linear-gradient(90deg,#6a1f1f,#d04848)}
.bar-mp{background:linear-gradient(90deg,#1f3960,#4d8fd0)}
.bar-cult{background:linear-gradient(90deg,#5d4a1f,#e0b840)}
.bar-life{background:linear-gradient(90deg,#2a4d2a,#6db86d)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:6px;font-size:11px}
.stat-pill{background:rgba(0,0,0,.25);border:1px solid rgba(201,169,110,.12);padding:5px 3px;text-align:center;border-radius:2px}
.stat-pill .l{color:#6b5d3c;font-size:10px}
.stat-pill .v{color:#d4c08a;font-size:13px;margin-top:1px}
.elements-row{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin-top:6px}
.element-tag{font-size:11px;padding:2px 8px;border-radius:2px;border:1px solid;font-weight:600;letter-spacing:1px}
.el-金{color:#f0d878;border-color:rgba(240,216,120,.5);background:rgba(240,216,120,.08)}
.el-木{color:#88e088;border-color:rgba(136,224,136,.5);background:rgba(136,224,136,.08)}
.el-水{color:#80b8f0;border-color:rgba(128,184,240,.5);background:rgba(128,184,240,.08)}
.el-火{color:#f08868;border-color:rgba(240,136,104,.5);background:rgba(240,136,104,.08)}
.el-土{color:#c0a878;border-color:rgba(192,168,120,.5);background:rgba(192,168,120,.08)}
.el-雷{color:#c8a0f8;border-color:rgba(200,160,248,.5);background:rgba(200,160,248,.08);text-shadow:0 0 6px rgba(200,160,248,.4)}
.el-冰{color:#a8e8f0;border-color:rgba(168,232,240,.5);background:rgba(168,232,240,.08);text-shadow:0 0 6px rgba(168,232,240,.4)}
.el-风{color:#b0f0c8;border-color:rgba(176,240,200,.5);background:rgba(176,240,200,.08);text-shadow:0 0 6px rgba(176,240,200,.4)}
.el-光{color:#f8f0a0;border-color:rgba(248,240,160,.5);background:rgba(248,240,160,.08);text-shadow:0 0 6px rgba(248,240,160,.4)}
.el-暗{color:#b890d0;border-color:rgba(184,144,208,.5);background:rgba(184,144,208,.08);text-shadow:0 0 6px rgba(184,144,208,.4)}
.log-panel{flex:1;min-height:180px;max-height:38vh;overflow-y:auto;scroll-behavior:smooth;font-size:13.5px;line-height:1.75}
.log-panel::-webkit-scrollbar{width:4px}
.log-panel::-webkit-scrollbar-track{background:transparent}
.log-panel::-webkit-scrollbar-thumb{background:rgba(201,169,110,.2);border-radius:2px}
.log-entry{padding:6px 0;border-bottom:1px dashed rgba(201,169,110,.08);animation:slideIn .4s ease-out}
.log-entry:last-child{border-bottom:none}
@keyframes slideIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.log-time{font-size:10px;color:#5a4d3c;letter-spacing:1px;margin-right:6px}
.log-good{color:#a8d090}.log-bad{color:#d68a8a}.log-special{color:#d4af37;font-weight:600}.log-mystic{color:#b9a0d8}.log-combat{color:#d8a060}.log-friend{color:#f0a8b8}.log-sad{color:#8aa8d0;font-style:italic}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.actions.three{grid-template-columns:repeat(3,1fr)}
button.action-btn{background:linear-gradient(180deg,rgba(60,45,80,.55),rgba(28,20,40,.85));border:1px solid rgba(201,169,110,.28);color:#e8d8b0;padding:9px 4px;font-family:inherit;font-weight:600;border-radius:3px;cursor:pointer;transition:all .15s;letter-spacing:1px;display:flex;flex-direction:column;align-items:center;gap:2px}
.action-btn .lbl{font-size:13px}
.action-btn .tm{font-size:9px;color:rgba(201,169,110,.5);font-weight:normal;letter-spacing:1px}
button.action-btn:hover{background:linear-gradient(180deg,rgba(95,72,115,.7),rgba(48,32,64,.9));border-color:rgba(201,169,110,.55)}
button.action-btn:active{transform:scale(.98)}
button.action-btn:disabled{opacity:.35;cursor:not-allowed}
button.action-btn.primary{background:linear-gradient(180deg,rgba(120,80,40,.7),rgba(80,50,25,.9));border-color:rgba(212,175,55,.5);color:#ffe8b0}
button.action-btn.primary:hover{background:linear-gradient(180deg,rgba(150,100,50,.8),rgba(100,65,30,1))}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:100;padding:14px;backdrop-filter:blur(4px);animation:fadeBg .25s}
@keyframes fadeBg{from{opacity:0}to{opacity:1}}
.modal{background:linear-gradient(135deg,#1a1428,#0d1018);border:1px solid rgba(201,169,110,.4);border-radius:4px;padding:20px 16px;max-width:440px;width:100%;max-height:88vh;overflow-y:auto;position:relative}
.modal h3{font-family:'Ma Shan Zheng',cursive;color:#d4af37;font-size:22px;margin-bottom:4px;letter-spacing:5px;text-align:center}
.modal .modal-sub{text-align:center;font-size:11px;color:#6b5d3c;letter-spacing:3px;margin-bottom:14px}
.modal .body{font-size:14px;line-height:1.85;color:#d8c8a0}
.modal .choices{display:flex;flex-direction:column;gap:7px;margin-top:14px}
.modal button.choice{background:rgba(50,40,65,.5);border:1px solid rgba(201,169,110,.3);color:#e8d8b0;padding:11px 12px;font-family:inherit;font-size:13.5px;border-radius:3px;cursor:pointer;text-align:left;transition:all .15s}
.modal button.choice:hover{background:rgba(90,70,110,.6);border-color:rgba(201,169,110,.6)}
.modal button.choice:disabled{opacity:.4;cursor:not-allowed}
.modal button.choice .hint{display:block;font-size:11px;color:#8b7d5c;margin-top:2px}
.inv-grid{display:grid;grid-template-columns:1fr;gap:6px;margin-top:8px}
.inv-item{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;background:rgba(0,0,0,.25);border:1px solid rgba(201,169,110,.12);border-radius:3px;font-size:13px}
.inv-item .nm{color:#c9a96e;font-weight:600}
.inv-item .ds{font-size:10px;color:#6b5d3c;display:block;margin-top:1px}
.inv-item .ct{color:#8b7d5c;margin:0 8px;font-size:12px}
.inv-item button{background:rgba(80,60,100,.5);border:1px solid rgba(201,169,110,.3);color:#e8d8b0;padding:5px 12px;font-family:inherit;font-size:11px;border-radius:2px;cursor:pointer}
.inv-item button:hover{background:rgba(120,90,140,.6)}
.inv-empty{text-align:center;color:#6b5d3c;padding:20px;font-size:13px}
.npc-card{padding:10px 12px;background:rgba(0,0,0,.28);border:1px solid rgba(201,169,110,.15);border-radius:3px;margin-bottom:6px;font-size:13px;cursor:pointer;transition:all .15s}
.npc-card:hover{border-color:rgba(201,169,110,.4);background:rgba(0,0,0,.4)}
.npc-card.dead{opacity:.5;cursor:default}
.npc-card.dead:hover{border-color:rgba(201,169,110,.15);background:rgba(0,0,0,.28)}
.npc-name{color:#c9a96e;font-weight:600;font-size:14px}
.npc-name .tag{display:inline-block;font-size:10px;color:#8b7d5c;margin-left:6px;padding:1px 6px;border:1px solid rgba(201,169,110,.2);border-radius:2px;font-weight:normal}
.npc-info{font-size:11px;color:#8b7d5c;margin-top:3px;display:flex;justify-content:space-between}
.npc-affinity{margin-top:5px;display:flex;align-items:center;gap:6px;font-size:10px}
.npc-affinity .label{color:#6b5d3c;width:32px}
.npc-affinity .bar-bg{flex:1;height:5px}
.npc-affinity .bar-fill{height:100%;background:linear-gradient(90deg,#b06090,#f0a8b8)}
.npc-affinity .num{color:#c9a96e;font-size:10px;width:30px;text-align:right}
.combat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.combat-side{background:rgba(0,0,0,.25);border:1px solid rgba(201,169,110,.18);padding:10px;border-radius:3px;text-align:center}
.combat-side h4{color:#c9a96e;font-size:14px;margin-bottom:6px;letter-spacing:2px}
.combat-side .hp{font-size:12px;color:#d68a8a}
.location-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:6px}
.loc-card{background:rgba(0,0,0,.28);border:1px solid rgba(201,169,110,.18);padding:10px;border-radius:3px;cursor:pointer;transition:all .15s;text-align:left;font-family:inherit;color:#e8d8b0}
.loc-card:hover{border-color:rgba(201,169,110,.5);background:rgba(40,30,50,.5)}
.loc-card:disabled{opacity:.4;cursor:not-allowed}
.loc-card .ln{color:#c9a96e;font-weight:600;font-size:13px}
.loc-card .ld{color:#6b5d3c;font-size:10px;margin-top:3px;line-height:1.5}
.loc-card .lr{color:#8b7d5c;font-size:10px;margin-top:3px}
.loc-card.current{border-color:rgba(212,175,55,.6);background:rgba(80,55,30,.3)}
.loc-card.current .ln::after{content:" ◆";color:#d4af37}
.start-screen{text-align:center;padding:30px 16px}
.start-screen h1{font-family:'Ma Shan Zheng',cursive;font-size:56px;color:#d4af37;letter-spacing:16px;margin-bottom:4px;text-shadow:0 0 32px rgba(212,175,55,.45)}
.start-screen .subtitle{color:#8b7d5c;margin-bottom:28px;letter-spacing:6px;font-size:13px}
.start-screen .opening{color:#a89878;font-size:14px;line-height:2;margin-bottom:24px;padding:0 8px;text-align:center}
.start-screen input{background:rgba(0,0,0,.45);border:1px solid rgba(201,169,110,.4);color:#e8d8b0;padding:12px;font-family:inherit;font-size:16px;border-radius:3px;text-align:center;width:220px;margin-bottom:16px;outline:none}
.start-screen input:focus{border-color:rgba(212,175,55,.8)}
.start-screen .start-btn{background:linear-gradient(180deg,rgba(140,95,50,.8),rgba(90,55,25,.95));border:1px solid rgba(212,175,55,.6);color:#ffe8b0;padding:12px 32px;font-family:'Ma Shan Zheng',cursive;font-size:18px;border-radius:3px;cursor:pointer;letter-spacing:6px;display:block;margin:0 auto 12px}
.start-screen .start-btn:hover{background:linear-gradient(180deg,rgba(170,115,60,.9),rgba(110,70,35,1))}
.menu-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:11px}
.menu-btn{background:transparent;border:1px solid rgba(201,169,110,.2);color:#8b7d5c;padding:4px 10px;font-family:inherit;font-size:11px;border-radius:2px;cursor:pointer;letter-spacing:1px}
.menu-btn:hover{color:#c9a96e;border-color:rgba(201,169,110,.4)}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:rgba(20,15,30,.95);border:1px solid rgba(212,175,55,.5);color:#ffe8b0;padding:9px 18px;border-radius:3px;font-size:13px;z-index:200;animation:toastIn .3s,toastOut .3s 2s forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-10px)}}
.save-indicator{position:fixed;top:8px;right:10px;font-size:10px;color:#d68a8a;z-index:50;letter-spacing:1px;opacity:0;transition:opacity .3s}
.save-indicator.visible{opacity:.9}
.spirit-root-天灵根{color:#ff6b9d;text-shadow:0 0 8px rgba(255,107,157,.5)}
.spirit-root-变异灵根{color:#b86bff}.spirit-root-单灵根{color:#6bd0ff}.spirit-root-双灵根{color:#6bff8a}.spirit-root-三灵根{color:#d4af37}.spirit-root-四灵根{color:#b89e6e}.spirit-root-五灵根{color:#8b7d5c}
.tag-mortal{background:rgba(140,100,60,.3);color:#d4a070!important;border-color:rgba(212,160,100,.3)!important}
.tag-cultivator{background:rgba(80,100,140,.3);color:#80a0d8!important;border-color:rgba(128,160,216,.3)!important}
.tag-romance{background:rgba(180,80,120,.3);color:#f0a8c0!important;border-color:rgba(240,168,192,.3)!important}
/* ===== 灵根测试开场仪式 ===== */
.ceremony{min-height:82vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 14px;animation:fadeBg .6s}
.ceremony .cer-scene{font-size:11px;color:#6b5d3c;letter-spacing:4px;margin-bottom:18px}
.ceremony .cer-text{font-size:15px;line-height:2.05;color:#d8c8a0;max-width:420px;margin-bottom:26px;min-height:60px}
.ceremony .cer-text .em{color:#d4af37;font-weight:600}
.ceremony .cer-text .whisper{color:#8b7d5c;font-style:italic}
.cer-orb{width:150px;height:150px;border-radius:50%;margin:6px auto 26px;position:relative;display:flex;align-items:center;justify-content:center;transition:all 1s}
.cer-orb .core{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.9),rgba(255,255,255,.1) 60%,transparent);opacity:.85}
.cer-orb.dim{filter:grayscale(.5) brightness(.7)}
.cer-orb .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,255,255,.15);animation:cerPulse 2.6s ease-in-out infinite}
.cer-orb .ring:nth-child(2){inset:-14px;animation-delay:.5s}
.cer-orb .ring:nth-child(3){inset:-28px;animation-delay:1s}
@keyframes cerPulse{0%,100%{transform:scale(.96);opacity:.5}50%{transform:scale(1.05);opacity:.9}}
.cer-root-name{font-family:'Ma Shan Zheng',cursive;font-size:44px;letter-spacing:8px;margin-bottom:8px;animation:rootReveal 1.2s ease-out both}
@keyframes rootReveal{from{opacity:0;transform:scale(.6);letter-spacing:24px}to{opacity:1;transform:scale(1)}}
.cer-elements{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 4px}
.cer-elements .element-tag{font-size:15px;padding:4px 14px;animation:rootReveal .9s ease-out both}
.cer-btn{background:linear-gradient(180deg,rgba(140,95,50,.8),rgba(90,55,25,.95));border:1px solid rgba(212,175,55,.6);color:#ffe8b0;padding:11px 30px;font-family:'Ma Shan Zheng',cursive;font-size:17px;border-radius:3px;cursor:pointer;letter-spacing:5px;margin-top:14px}
.cer-btn:hover{background:linear-gradient(180deg,rgba(170,115,60,.9),rgba(110,70,35,1))}
.cer-skip{margin-top:16px;background:none;border:none;color:#5a4d3c;font-family:inherit;font-size:11px;letter-spacing:2px;cursor:pointer}
.cer-skip:hover{color:#8b7d5c}
</style>
</head>

<script>
"use strict";
const STORAGE_KEY="xunDao_save_v4",SAVE_VERSION=4;
const ELEMENTS_BASIC=["金","木","水","火","土"],ELEMENTS_VARIANT=["雷","冰","风","光","暗"];
const ELEMENT_INFO={"金":{color:"el-金",desc:"锋锐之气",bonus:"攻击+12%"},"木":{color:"el-木",desc:"生生之气",bonus:"气血+12%、灵草翻倍"},"水":{color:"el-水",desc:"灵动之气",bonus:"法力+20%、修炼回法"},"火":{color:"el-火",desc:"炽烈之气",bonus:"法术+30%"},"土":{color:"el-土",desc:"坚厚之气",bonus:"防御+15%"},"雷":{color:"el-雷",desc:"雷霆变异",bonus:"法术+40%、攻击+10%"},"冰":{color:"el-冰",desc:"冰寒变异",bonus:"法力+30%、防御+10%"},"风":{color:"el-风",desc:"灵风变异",bonus:"修为+15%、遁走+30%"},"光":{color:"el-光",desc:"圣光变异",bonus:"气血+20%、道心增益"},"暗":{color:"el-暗",desc:"暗影变异",bonus:"攻击+20%、暴击15%"}};

function getLocationEnemy(s){
  const loc=LOCATIONS[s.location];
  const types=loc.enemyTypes||["妖兽"];
  for(const r of [s.realm,s.realm-1,s.realm+1,0]){
    if(r<0)continue;
    const validTypes=types.filter(t=>ENEMY_POOLS[t]&&ENEMY_POOLS[t][r]);
    if(validTypes.length===0)continue;
    const t=validTypes[rand(0,validTypes.length-1)];
    const pool=ENEMY_POOLS[t][r];
    return {...pool[rand(0,pool.length-1)]};
  }
  return {...ENEMY_POOLS["妖兽"][0][0]};
}

function getSpecAtkMult(s){return s.spec==="sword"?1.15:1}
function getSpecDefMult(s){return s.spec==="body"?1.15:1}
function getSpecHpMult(s){return s.spec==="body"?1.20:1}

function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function chance(p){return Math.random()*100<p}
function pickWeighted(arr,getW){const total=arr.reduce((a,b)=>a+getW(b),0);let r=Math.random()*total;for(const item of arr){r-=getW(item);if(r<=0)return item}return arr[arr.length-1]}
function addItem(s,name,count){s.inventory[name]=(s.inventory[name]||0)+count}
function removeItem(s,name,count=1){if(!s.inventory[name]||s.inventory[name]<count)return false;s.inventory[name]-=count;if(s.inventory[name]<=0)delete s.inventory[name];return true}
function realmName(realm,stage){if(realm<0)return "凡人";const r=REALMS[realm];return r?`${r.name}${r.stages[stage]||''}`:"未知"}
function getRealmName(s){return realmName(s.realm,s.stage)}
function getExpNeeded(s){return Math.floor(REALMS[s.realm].expBase*Math.pow(1.4,s.stage))}
function getCurrentAtk(s){let atk=s.atk+(s.weapon?EQUIP[s.weapon].atk:0);if(s.elements.includes("金"))atk=Math.floor(atk*1.12);if(s.elements.includes("雷"))atk=Math.floor(atk*1.10);if(s.elements.includes("暗"))atk=Math.floor(atk*1.20);atk=Math.floor(atk*getSpecAtkMult(s));return atk}
function getCurrentDef(s){let def=s.def+(s.armor?EQUIP[s.armor].def:0);if(s.elements.includes("土"))def=Math.floor(def*1.15);if(s.elements.includes("冰"))def=Math.floor(def*1.10);def=Math.floor(def*getSpecDefMult(s));return def}
function getSkillMult(s){let m=1.8;if(s.elements.includes("火"))m+=0.3;if(s.elements.includes("雷"))m+=0.4;if(s.spec==="sword")m+=0.3;return m}
function getExpBonus(s){let b=1;if(s.elements.includes("风"))b*=1.15;if(s.spec==="alchemy")b*=1.08;return b}
function getFleeBonus(s){return s.elements.includes("风")?30:0}
function getCritChance(s){return s.elements.includes("暗")?15:0}
function getRequiredItem(s){if(s.realm===0)return "筑基丹";if(s.realm===1)return "金丹妙药";if(s.realm===2)return "婴变果";if(s.realm===3)return "神化露";if(s.realm===4)return "渡劫丹";return null}

let state=null,modalStack=[],combatState=null;

/* ===== 存档:localStorage ===== */
function loadState(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&parsed.version===SAVE_VERSION){if(!parsed.flags)parsed.flags={};state=parsed}}}catch(e){console.error("Load error:",e)}}
function saveStateAsync(){
  if(!state)return;
  try{
    state.version=SAVE_VERSION;
    state.savedAt=Date.now();
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state));
  }catch(e){
    console.error("Save error:",e);
    const el=document.getElementById("saveIndicator");
    if(el){el.textContent="⚠ 保存失败";el.classList.add("visible");setTimeout(()=>el.classList.remove("visible"),3000);}
  }
}
function resetState(){try{localStorage.removeItem(STORAGE_KEY)}catch(e){}state=null;modalStack=[];combatState=null;render()}

function rollSpiritRoot(){const root=pickWeighted(SPIRIT_ROOTS,x=>x.weight);let elements;if(root.type==="天")elements=[...ELEMENTS_BASIC];else if(root.type==="变异")elements=[ELEMENTS_VARIANT[rand(0,ELEMENTS_VARIANT.length-1)]];else if(root.type==="五")elements=[...ELEMENTS_BASIC];else{const pool=[...ELEMENTS_BASIC];elements=[];for(let i=0;i<root.elementCount;i++){const idx=rand(0,pool.length-1);elements.push(pool.splice(idx,1)[0])}}return{root,elements}}

function newGame(name,rolled){
  const{root,elements}=rolled||rollSpiritRoot();
  state={version:SAVE_VERSION,name:name||"无名",gender:"女",spiritRoot:root.name,rootMult:root.mult,rootDesc:root.desc,elements,age:16,yearFraction:0,realm:0,stage:0,exp:0,hp:60,maxHp:60,mp:30,maxMp:30,atk:6,def:4,daoHeart:60,maxLifespan:100,spiritStones:60,inventory:{"聚灵丹":3,"回春丹":2},weapon:"桃木剑",armor:"粗布道袍",partner:null,location:"青云山",npcs:{},log:[],flags:{},alive:true,ascended:false,spec:null};
  const starter=["苏婉清","林若雪","陆景行","玄阳真人","阿青","张姨","王老板"];
  for(const n of starter)initNPC(state,n);
  applyRealmStats(state);
  state.hp=state.maxHp;state.mp=state.maxMp;
  log("special",`※ 你出生于落霞镇外的小村,自幼显露${root.name}之资,${elements.length===1?`属${elements[0]}`:`兼具${elements.join("、")}`}灵根。`);
  log("mystic",`「${root.desc}」`);
  log("",`十六岁那年,云游道长拂尘一指,将你引入青云山修行之门。从此,你便是练气期一层的女修了。`);
  log("friend",`※ 你在青云山结识了师姐苏婉清、师妹林若雪、师兄陆景行,及师叔玄阳真人。`);
  log("friend",`※ 落霞镇上,亦有挚友阿青、长辈张姨、商贾王老板。`);
  log("",`——修仙路漫漫,由此始。`);
}

function initNPC(state,name){const t=NPC_TEMPLATES[name];if(!t)return;state.npcs[name]={name:t.name,realm:t.initRealm,stage:t.initStage,age:t.initAge,maxLifespan:t.initLifespan,affinity:10,arcsTriggered:[],status:"alive",statusReason:"",deathAge:null,metAge:state.age}}

function applyRealmStats(s){const baseHp=[80,1000,6000,35000,200000,1100000][s.realm]||80;const baseMp=[40,500,3000,18000,100000,550000][s.realm]||40;const baseAtk=[8,70,450,2200,11000,60000][s.realm]||8;const baseDef=[5,50,300,1500,8000,42000][s.realm]||5;const stageBonus=1+s.stage*0.4;let maxHp=Math.floor(baseHp*stageBonus),maxMp=Math.floor(baseMp*stageBonus);let atk=Math.floor(baseAtk*stageBonus),def=Math.floor(baseDef*stageBonus);if(s.elements.includes("木"))maxHp=Math.floor(maxHp*1.12);if(s.elements.includes("水"))maxMp=Math.floor(maxMp*1.20);if(s.elements.includes("冰"))maxMp=Math.floor(maxMp*1.30);if(s.elements.includes("光"))maxHp=Math.floor(maxHp*1.20);maxHp=Math.floor(maxHp*getSpecHpMult(s));s.maxHp=maxHp;s.maxMp=maxMp;s.atk=atk;s.def=def}

function log(type,text){if(!state)return;state.log.push({type,text,age:state.age});if(state.log.length>300)state.log.shift()}

function passSeasons(n,longPassage=false){state.yearFraction+=n;let yearsPassed=0;while(state.yearFraction>=4){state.yearFraction-=4;state.age+=1;yearsPassed+=1}if(yearsPassed>0)updateAllNPCs(yearsPassed,longPassage);if(state.age>=state.maxLifespan&&state.alive){state.alive=false;log("bad",`※ 寿元已尽,你于 ${state.age} 岁那年坐化。修仙路漫漫,未能得道飞升。`)}}

function updateAllNPCs(years,longPassage){for(const name in state.npcs){const npc=state.npcs[name];const tmpl=NPC_TEMPLATES[name];if(!tmpl||npc.status!=="alive")continue;npc.age+=years;if(!tmpl.isMortal&&tmpl.growthRate>0){for(let i=0;i<years;i++){if(chance(tmpl.growthRate*6)){npc.stage+=1;if(npc.stage>=REALMS[npc.realm].stages.length&&npc.realm<REALMS.length-1){if(chance(75)){npc.realm+=1;npc.stage=0;if(longPassage)log("friend",`※ 听闻 ${name} 已突破至 ${realmName(npc.realm,npc.stage)}。`)}else npc.stage=REALMS[npc.realm].stages.length-1}}}}if(longPassage&&tmpl.fragility>0){for(let i=0;i<years;i++){if(chance(tmpl.fragility*100)){const fates=[{reason:"突破时走火入魔陨落",weight:3,status:"dead"},{reason:"渡劫失败陨落",weight:tmpl.initRealm>=2?2:0,status:"dead"},{reason:"与魔修交手时身亡",weight:2,status:"dead"},{reason:"云游远方,再无音讯",weight:3,status:"missing"},{reason:"得道飞升",weight:tmpl.initRealm>=4?2:0,status:"ascended"}].filter(f=>f.weight>0);const fate=pickWeighted(fates,x=>x.weight);npc.status=fate.status;npc.statusReason=fate.reason;npc.deathAge=npc.age;break}}}if(npc.age>=npc.maxLifespan&&npc.status==="alive"){npc.status="dead";npc.statusReason=tmpl.isMortal?"寿终正寝":"寿元已尽";npc.deathAge=npc.age}}}

function reportNPCChangesAfterSeclusion(snapshot){for(const name in state.npcs){const npc=state.npcs[name];const before=snapshot[name];if(!before||before.status!=="alive"||npc.status==="alive")continue;const tmpl=NPC_TEMPLATES[name];const close=npc.affinity>=60;if(npc.status==="dead"){if(tmpl.isMortal)log("sad",`※ 你出关后,行至落霞镇,得知 ${name} 已${close?"于数年前":""}${npc.statusReason},享年 ${npc.deathAge} 岁。${close?"你站在熟悉的小巷口,久久无言。":""}`);else log("sad",`※ 出关后听闻,${name}已${npc.statusReason},享年 ${npc.deathAge} 岁。${close?"故人已矣,唯余怅然。":""}`)}else if(npc.status==="missing")log("sad",`※ 出关后才知,${name}早已${npc.statusReason}。${close?"再无相见之日。":""}`);else if(npc.status==="ascended")log("special",`※ 出关后听闻,${name}已${npc.statusReason}!金光冲天而去。`)}}

// ============== 宗门赠丹 ==============
function checkSectGifts(){
  if(!state.alive)return;
  if(!state.flags.gotJiJi&&state.realm===0&&state.stage>=6&&!state.inventory["筑基丹"]){
    state.flags.gotJiJi=true;
    addItem(state,"筑基丹",1);
    log("special",`※ 玄阳真人见你已至练气七层,赠你筑基丹一枚:「此为宗门资助,望你早日筑基。」`);
  }
  if(!state.flags.gotJinDan&&state.realm===1&&state.stage>=1&&!state.inventory["金丹妙药"]){
    state.flags.gotJinDan=true;
    addItem(state,"金丹妙药",1);
    log("special",`※ 玄阳真人将一颗金丹妙药交予你:「凝结金丹乃修行大关,宗门尽力相助。」`);
  }
  if(!state.flags.hintYingBian&&state.realm===2&&state.stage>=2){
    state.flags.hintYingBian=true;
    log("mystic",`※ 玄阳真人摇头叹道:「化婴所需的婴变果,宗门已无存货。万妖谷或上古遗迹中或有,需自行寻觅。」`);
  }
  if(!state.flags.hintShenHua&&state.realm===3&&state.stage>=2){
    state.flags.hintShenHua=true;
    log("mystic",`※ 化神所需『神化露』,宗门更无此物。海外仙岛、九幽冥土或可寻得。`);
  }
  if(!state.flags.hintDuJie&&state.realm===4&&state.stage>=2){
    state.flags.hintDuJie=true;
    log("mystic",`※ 渡劫所需『渡劫丹』极为难得,唯亲身入九幽冥土深处或仙岛深处寻觅。`);
  }
}

// ============== ACTIONS ==============
function actCultivate(){if(!state.alive)return;const realmMult=1+state.realm*0.5;const baseGain=8+rand(0,8);const gain=Math.floor(baseGain*state.rootMult*realmMult*getExpBonus(state));state.exp+=gain;state.mp=Math.min(state.maxMp,state.mp+Math.floor(state.maxMp*(state.elements.includes("水")?0.25:0.15)));passSeasons(1);log("",`打坐修炼,灵气如丝缕入体,修为增长 ${gain} 点。`);if(chance(6)){const bonus=Math.floor(gain*1.5);state.exp+=bonus;state.daoHeart=Math.min(100,state.daoHeart+2);log("mystic",`※ 修炼时忽有顿悟,额外增长 ${bonus} 修为!`)}checkSectGifts();afterAction()}

function actSeclude(){
  if(!state.alive)return;
  openModal({
    title:"闭 关",sub:"数载光阴",
    body:"闭关期间若修为溢出,将自动突破小境界;若身上有突破大境界所需丹药,亦会自动尝试。\n\n时间越长,世事变迁越甚——故友或已不在。",
    choices:[
      {label:"短期闭关",hint:"3 年",action:()=>{closeModal();doSeclude(3)}},
      {label:"中期闭关",hint:"7 年",action:()=>{closeModal();doSeclude(7)}},
      {label:"长期闭关",hint:"15 年",action:()=>{closeModal();doSeclude(15)}},
      {label:"远期闭关",hint:"30 年(凡人挚友难再相见)",action:()=>{closeModal();confirmSeclude(30)}},
      {label:"百年闭关",hint:"100 年(多数凡人皆离世)",action:()=>{closeModal();confirmSeclude(100)}},
      {label:"大闭关",hint:"300 年(人间已是另一番光景)",action:()=>{closeModal();confirmSeclude(300)}},
      {label:"再想想",hint:"",action:()=>{closeModal();render()}}
    ]
  });
}

function confirmSeclude(years){
  openModal({
    title:"再三确认",sub:`即将闭关 ${years} 年`,
    body:`闭关 ${years} 载,乃是漫长光阴。出关之后,世事或已沧桑——亲朋多半已逝,故旧未必尚在。\n\n你确定要踏入这段独行的岁月吗？`,
    choices:[
      {label:`决意闭关 ${years} 年`,hint:"无可挽回",action:()=>{closeModal();doSeclude(years)}},
      {label:"再想想",hint:"",action:()=>{closeModal();render()}}
    ]
  });
}

function doSeclude(years){
  const snapshot={};for(const n in state.npcs)snapshot[n]={...state.npcs[n]};
  let deviateChance=Math.max(2,25-state.daoHeart/4);
  if(state.spec==="body")deviateChance*=0.5;
  if(chance(deviateChance)){const dmg=Math.floor(state.maxHp*0.4);state.hp=Math.max(1,state.hp-dmg);state.daoHeart=Math.max(0,state.daoHeart-10);const partialGain=Math.floor((4+rand(0,4))*4*0.3*state.rootMult*(1+state.realm*0.5)*getExpBonus(state));state.exp+=partialGain;passSeasons(years*4,true);log("bad",`※ 闭关 ${years} 载,不慎走火入魔!经脉受损 ${dmg},道心动摇,修为仅得 ${partialGain} 点。`);reportNPCChangesAfterSeclusion(snapshot);afterAction();return}
  let totalExpGained=0,breakthroughs=[],realmJumps=[],failedBreakthroughs=0;
  for(let y=0;y<years;y++){
    if(!state.alive)break;
    const realmMult=1+state.realm*0.5;
    const yearGain=Math.floor((10+rand(0,8))*4*state.rootMult*realmMult*getExpBonus(state));
    state.exp+=yearGain;totalExpGained+=yearGain;
    passSeasons(4,true);
    if(!state.alive)break;
    let safety=0;
    while(state.exp>=getExpNeeded(state)&&safety<5){
      safety++;
      const isRealmJump=state.stage>=REALMS[state.realm].stages.length-1;
      if(isRealmJump&&state.realm===REALMS.length-1)break;
      const requiredItem=isRealmJump?getRequiredItem(state):null;
      if(requiredItem&&!(state.inventory[requiredItem]>0))break;
      let rate=Math.min(95,55+state.daoHeart/2);
      if(isRealmJump)rate-=15;
      if(state.realm>=4)rate-=8;
      rate=Math.max(15,Math.floor(rate));
      if(isRealmJump&&requiredItem)removeItem(state,requiredItem,1);
      if(chance(rate)){
        if(isRealmJump){state.realm+=1;state.stage=0;state.maxLifespan+=REALMS[state.realm].lifeAdd;realmJumps.push(REALMS[state.realm].name)}
        else{state.stage+=1;breakthroughs.push(getRealmName(state))}
        state.exp=0;applyRealmStats(state);checkSectGifts();
      }else{state.exp=Math.floor(state.exp*0.6);state.daoHeart=Math.max(0,state.daoHeart-5);failedBreakthroughs++;break}
    }
  }
  state.hp=state.maxHp;state.mp=state.maxMp;
  log("special",`闭关 ${years} 载,岁月如梭。修为累计增长 ${totalExpGained} 点。`);
  if(realmJumps.length>0)log("special",`※※ 闭关之中,你成功突破至 ${realmJumps.join(" → ")}!`);
  if(breakthroughs.length>0)log("good",`小境界突破:${breakthroughs.join("、")}。`);
  if(failedBreakthroughs>0)log("bad",`期间有 ${failedBreakthroughs} 次突破失败,损失部分修为,道心略有动摇。`);
  reportNPCChangesAfterSeclusion(snapshot);
  afterAction();
}

function actAdventure(){
  if(!state.alive)return;
  passSeasons(1);
  const loc=LOCATIONS[state.location];
  const eventId=loc.events[rand(0,loc.events.length-1)];
  let evt;
  if(eventId==="beast"){
    const e=getLocationEnemy(state);
    evt={text:`一头 ${e.name} 突然杀出,挡在你面前!`,type:"combat",combat:{...e,hp:e.hp,maxHp:e.hp}};
  }else{
    const fn=EVENTS[eventId];
    evt=fn?fn(state):{text:`你在${loc.name}游历一番,并无特别收获。`,type:""};
  }
  if(evt.combat){log("combat",`※ ${evt.text}`);openCombat(evt.combat);return}
  if(evt.choices){
    openModal({title:"奇 遇",sub:state.location,body:evt.text,
      choices:evt.choices.map(c=>({label:c.label,hint:c.hint,action:()=>{const r=c.do();log(r.type||"",r.text);closeModal();checkSectGifts();afterAction()}}))});
    return;
  }
  log(evt.type||"",evt.text);
  checkSectGifts();
  afterAction();
}

function actBreakthrough(){
  if(!state.alive)return;
  const needed=getExpNeeded(state);
  if(state.exp<needed){toast("修为不足,无法突破");return}
  const isRealmJump=state.stage>=REALMS[state.realm].stages.length-1;
  const nextRealmName=isRealmJump&&state.realm<REALMS.length-1?REALMS[state.realm+1].name:null;
  const requiredItem=isRealmJump?getRequiredItem(state):null;
  let rate=Math.min(95,55+state.daoHeart/2);
  if(isRealmJump)rate-=15;
  if(state.realm>=4)rate-=8;
  rate=Math.max(15,Math.floor(rate));
  const stoneCost=(state.realm+1)*50;
  const hasItem=requiredItem?(state.inventory[requiredItem]||0)>0:true;
  let bodyText="";
  if(state.realm===REALMS.length-1&&state.stage===REALMS[state.realm].stages.length-1)bodyText=`你已至 ${getRealmName(state)},将面临天劫,飞升上界!`;
  else if(isRealmJump){bodyText=`你即将由 ${REALMS[state.realm].name} 突破至 ${nextRealmName},乃修行大关!`;if(requiredItem)bodyText+=`\n\n需要:${requiredItem}(${hasItem?'已具备 ✓':'尚缺 ✗'})`}
  else bodyText=`你将由 ${getRealmName(state)} 进境至 ${REALMS[state.realm].name}${REALMS[state.realm].stages[state.stage+1]}。`;
  bodyText+=`\n\n基础成功率:${rate}%(每点道心 +0.5%)\n消耗灵石:${stoneCost}(提升5%)`;
  const choices=[];
  if(state.realm===REALMS.length-1&&state.stage===REALMS[state.realm].stages.length-1){
    choices.push({label:"迎接天劫,渡劫飞升",hint:"九死一生,不渡则陨",action:()=>{closeModal();attemptAscension()}});
    choices.push({label:"暂缓",hint:"",action:()=>{closeModal();render()}});
  }else{
    if(isRealmJump&&requiredItem&&!hasItem)choices.push({label:`突破(缺少${requiredItem})`,hint:"无法尝试",action:()=>toast(`需 ${requiredItem}`)});
    else{
      const finalRate=state.spiritStones>=stoneCost?rate+5:rate;
      choices.push({label:state.spiritStones>=stoneCost?`消耗灵石突破(${finalRate}%)`:`突破(灵石不足,${rate}%)`,hint:state.spiritStones>=stoneCost?"":"灵石不够,无加成",action:()=>{if(state.spiritStones>=stoneCost)state.spiritStones-=stoneCost;if(isRealmJump&&requiredItem)removeItem(state,requiredItem,1);closeModal();attemptBreakthrough(finalRate)}});
    }
    choices.push({label:"再修炼些时日",hint:"",action:()=>{closeModal();render()}});
  }
  openModal({title:"突 破",sub:"修行大关",body:bodyText,choices});
}

function attemptBreakthrough(rate){passSeasons(2);if(chance(rate)){const isRealmJump=state.stage>=REALMS[state.realm].stages.length-1;if(isRealmJump){state.realm+=1;state.stage=0;state.maxLifespan+=REALMS[state.realm].lifeAdd;log("special",`※※ 你成功突破,晋入 ${REALMS[state.realm].name}!寿元 +${REALMS[state.realm].lifeAdd}。`)}else{state.stage+=1;log("special",`※ 你成功突破,进境至 ${getRealmName(state)}!`)}state.exp=0;applyRealmStats(state);state.hp=state.maxHp;state.mp=state.maxMp;checkSectGifts()}else{const lost=Math.floor(state.exp*0.3);state.exp-=lost;state.daoHeart=Math.max(0,state.daoHeart-8);const dmg=Math.floor(state.maxHp*0.3);state.hp=Math.max(1,state.hp-dmg);log("bad",`※ 突破失败!经脉受损 ${dmg},损失修为 ${lost},道心受挫。`)}afterAction()}

function attemptAscension(){passSeasons(2);const score=state.daoHeart+Math.min(50,state.exp/10000);if(chance(score)){state.alive=false;state.ascended=true;log("special","※※※ 九重天劫尽数渡过!金光自天而降,将你笼罩——");log("mystic","※ 你身周浮现仙文道纹,肉身化虹,破空而去。");log("special",`※ 历尽 ${state.age-16} 载修行,你终成仙道,飞升上界。`)}else{state.alive=false;log("bad","※ 天劫无情,你终究未能渡过最后一击……");log("bad",`※ 修行 ${state.age-16} 载,魂飞魄散于劫雷之中。`)}afterAction()}

function actTravel(){const choices=Object.entries(LOCATIONS).map(([key,loc])=>({key,loc,accessible:state.realm>=loc.minRealm,isCurrent:state.location===key}));const html=`<div class="location-grid">${choices.map(c=>`<button class="loc-card ${c.isCurrent?'current':''}" data-loc="${c.key}" ${(!c.accessible||c.isCurrent)?'disabled':''}><div class="ln">${c.loc.name}</div><div class="ld">${c.loc.desc}</div><div class="lr">${c.accessible?`要求:${REALMS[c.loc.minRealm].name}`:`※ 需${REALMS[c.loc.minRealm].name}方可前往`}</div></button>`).join('')}</div>`;openModal({title:"出 行",sub:`当前:${state.location}`,body:"",html,choices:[{label:"返回",hint:"",action:()=>{closeModal();render()}}]});setTimeout(()=>{document.querySelectorAll("[data-loc]").forEach(btn=>{btn.onclick=()=>{const key=btn.getAttribute("data-loc");if(key===state.location)return;if(state.realm<LOCATIONS[key].minRealm)return;state.location=key;passSeasons(1);log("",`你启程前往${LOCATIONS[key].name}。`);if(key==="灵药峰"&&!state.npcs["周明月"]){initNPC(state,"周明月");log("friend",`※ 你于灵药峰偶遇散修周明月,二人相谈甚欢,结为道友。`)}closeModal();afterAction()}})},0)}

function actSocial(){const npcsAtLoc=[],npcsRemote=[];for(const name in state.npcs){const npc=state.npcs[name],tmpl=NPC_TEMPLATES[name];if(!tmpl)continue;if(tmpl.location===state.location)npcsAtLoc.push({name,npc,tmpl});else npcsRemote.push({name,npc,tmpl})}const renderCard=({name,npc,tmpl},atLoc)=>{const dead=npc.status!=="alive";let info="";if(npc.status==="alive")info=`${tmpl.isMortal?"凡人":realmName(npc.realm,npc.stage)} · ${npc.age}岁`;else if(npc.status==="dead")info=`已逝 · ${npc.statusReason}`;else if(npc.status==="missing")info=`失踪 · ${npc.statusReason}`;else if(npc.status==="ascended")info=`飞升 · ${npc.statusReason}`;return `<div class="npc-card ${dead?'dead':''}" ${!dead?(atLoc?`data-npc="${name}"`:`data-remote="${name}"`):''}><div class="npc-name">${name}<span class="tag ${tmpl.color}">${tmpl.type}</span></div><div class="npc-info"><span>${info}</span><span>${atLoc?'此地 · 可相见':`远在${tmpl.location} · 可联络`}</span></div>${!dead?`<div class="npc-affinity"><span class="label">好感</span><div class="bar-bg"><div class="bar-fill" style="width:${npc.affinity}%"></div></div><span class="num">${npc.affinity}/100</span></div>`:''}</div>`};let html="";if(npcsAtLoc.length>0){html+=`<div style="font-size:11px;color:#8b7d5c;margin:10px 0 6px;letter-spacing:2px;">— 此处友人 —</div>`;html+=npcsAtLoc.map(x=>renderCard(x,true)).join('')}if(npcsRemote.length>0){html+=`<div style="font-size:11px;color:#8b7d5c;margin:14px 0 6px;letter-spacing:2px;">— 远方故人 —</div>`;html+=npcsRemote.map(x=>renderCard(x,false)).join('')}if(npcsAtLoc.length===0&&npcsRemote.length===0)html='<div class="inv-empty">尚无相识之人。</div>';openModal({title:"故 人",sub:state.location,body:"",html,choices:[{label:"返回",hint:"",action:()=>{closeModal();render()}}]});setTimeout(()=>{document.querySelectorAll("[data-npc]").forEach(card=>{card.onclick=()=>{const name=card.getAttribute("data-npc");closeModal();visitNPC(name)}});document.querySelectorAll("[data-remote]").forEach(card=>{card.onclick=()=>{const name=card.getAttribute("data-remote");closeModal();contactNPC(name)}})},0)}

function visitNPC(name){if(name==="江照白")return visitRival();const npc=state.npcs[name],tmpl=NPC_TEMPLATES[name];if(!npc||npc.status!=="alive")return;const choices=[{label:"闲谈论道",hint:"好感+3~+6 · 1 季",action:()=>{closeModal();npcChat(name)}},{label:"切磋共修",hint:"好感+2,修为略增 · 1 季",action:()=>{closeModal();npcCultivate(name)}}];if(state.spiritStones>=50||hasGiftItem())choices.push({label:"赠送礼物",hint:"好感大增",action:()=>{closeModal();npcGift(name)}});choices.push({label:"告辞",hint:"",action:()=>{closeModal();render()}});let bodyText=`${tmpl.desc}\n\n境界:${tmpl.isMortal?"凡人":realmName(npc.realm,npc.stage)}\n年岁:${npc.age}(寿元 ${npc.maxLifespan})\n好感:${npc.affinity}/100`;openModal({title:name,sub:tmpl.type,body:bodyText,choices})}

function hasGiftItem(){return ["低阶灵草","中阶灵草","高阶灵草","聚灵丹","回春丹","凝神丹"].some(it=>state.inventory[it])}

/* ===== 联络老友 ===== */
const MESSAGE_REPLIES={
"阿青":"阿青的回信字迹歪扭,说镇上的桃花又开了,问你几时回来看看。",
"张姨":"张姨托人捎话,说给你留着腌菜呢,让你别嫌弃。",
"王老板":"王老板回信,顺带问你近来可有法器出手,生意人本色不改。",
"苏婉清":"苏婉清回信寥寥数语,却句句关切,末了叮嘱你按时进食、莫要贪功。",
"林若雪":"若雪的回信满纸想念,还画了个丑丑的笑脸。",
"陆景行":"陆景行的回信只有八字:『见字如面,勿念,珍重。』",
"周明月":"明月道友回信洒脱,说她又寻见一处好玩的秘境,下次带你去。",
"玄阳真人":"玄阳真人回讯多是修行叮咛,言辞虽淡,用心却深。",
"江照白":"江照白的回讯只有一句:『少来烦我。』——可你注意到,她终究还是回了。"
};
function contactNPC(name){
  const npc=state.npcs[name],tmpl=NPC_TEMPLATES[name];
  if(!npc||npc.status!=="alive"){toast("故人已不在了。");return;}
  openModal({title:name,sub:`远在${tmpl.location} · ${tmpl.isMortal?"凡人":realmName(npc.realm,npc.stage)}`,
    body:`${tmpl.desc}\n\n好感:${npc.affinity}/100\n\n山高水远,亦可鱼雁传书,或请其一见。`,
    choices:[
      {label:"传讯寄语",hint:"千里相闻,增进情谊 · 1 季",action:()=>{closeModal();sendMessage(name);}},
      {label:"相约一见",hint:"请TA前来相见 · 1 季",action:()=>{closeModal();passSeasons(1);log("friend",`你传讯相约,${name}不辞远途,如约而至。`);if(name==="江照白")visitRival();else visitNPC(name);}},
      {label:"返回",hint:"",action:()=>{closeModal();actSocial();}}
    ]});
}
function sendMessage(name){
  const npc=state.npcs[name],tmpl=NPC_TEMPLATES[name];
  const gain=2+rand(0,3);const oldAff=npc.affinity;npc.affinity=Math.min(100,npc.affinity+gain);
  if(name==="江照白"&&state.flags.rival)state.flags.rival.respect=Math.min(100,state.flags.rival.respect+gain);
  passSeasons(1);
  const reply=MESSAGE_REPLIES[name]||(tmpl.isMortal?"对方回了信,絮絮说着家常,末了总是那句『保重』。":"对方回讯致意,言语间满是道友之谊。");
  log("friend",`你修书一封,寄予远方的${name}。${reply} 好感 +${gain}。`);
  if(chance(16)){const pool=tmpl.gifts&&Object.values(tmpl.gifts).length?Object.values(tmpl.gifts):[["低阶灵草",1]];const g=pool[rand(0,pool.length-1)];if(g&&g[0]&&ITEMS[g[0]]){addItem(state,g[0],g[1]);log("good",`※ ${name}随信回赠 ${g[0]}×${g[1]}。`);}}
  triggerNPCArcs(name,oldAff,npc.affinity);
  afterAction();
}

function npcChat(name){const npc=state.npcs[name],tmpl=NPC_TEMPLATES[name];const gain=3+rand(0,3);const oldAff=npc.affinity;npc.affinity=Math.min(100,npc.affinity+gain);passSeasons(1);log("friend",`你与 ${name} 闲谈论道,相谈甚欢。好感 +${gain}。`);if(!tmpl.isMortal)state.daoHeart=Math.min(100,state.daoHeart+1);triggerNPCArcs(name,oldAff,npc.affinity);afterAction()}
function npcCultivate(name){const npc=state.npcs[name],tmpl=NPC_TEMPLATES[name];const oldAff=npc.affinity;npc.affinity=Math.min(100,npc.affinity+2);if(!tmpl.isMortal&&npc.realm>state.realm){const gain=Math.floor((15+rand(0,15))*state.rootMult*(npc.realm-state.realm+1)*getExpBonus(state));state.exp+=gain;log("friend",`${name}指点你修行片刻,修为大进 ${gain} 点。好感 +2。`)}else if(!tmpl.isMortal){const gain=Math.floor((8+rand(0,8))*state.rootMult*getExpBonus(state));state.exp+=gain;log("friend",`你与 ${name} 切磋一番,修为增长 ${gain} 点。好感 +2。`)}else{log("friend",`你与 ${name} 在镇上散步谈天,颇感放松。好感 +2。`);state.daoHeart=Math.min(100,state.daoHeart+2)}passSeasons(1);triggerNPCArcs(name,oldAff,npc.affinity);checkSectGifts();afterAction()}

function npcGift(name){const npc=state.npcs[name];const giftItems=[{it:"低阶灵草",aff:5,cond:!!state.inventory["低阶灵草"]},{it:"中阶灵草",aff:10,cond:!!state.inventory["中阶灵草"]},{it:"高阶灵草",aff:15,cond:!!state.inventory["高阶灵草"]},{it:"聚灵丹",aff:8,cond:!!state.inventory["聚灵丹"]},{it:"回春丹",aff:10,cond:!!state.inventory["回春丹"]},{it:"凝神丹",aff:12,cond:!!state.inventory["凝神丹"]}].filter(g=>g.cond);if(state.spiritStones>=50)giftItems.push({it:"灵石50",aff:6,isStones:true});if(giftItems.length===0){toast("无可赠之物");return}openModal({title:"赠 礼",sub:name,body:"选一样赠予对方:",choices:[...giftItems.map(g=>({label:`${g.it} (好感 +${g.aff})`,hint:"",action:()=>{if(g.isStones)state.spiritStones-=50;else removeItem(state,g.it,1);const oldAff=npc.affinity;npc.affinity=Math.min(100,npc.affinity+g.aff);passSeasons(1);log("friend",`你赠送 ${name} ${g.it},对方欣然收下。好感 +${g.aff}。`);triggerNPCArcs(name,oldAff,npc.affinity);closeModal();afterAction()}})),{label:"再想想",hint:"",action:()=>{closeModal();render()}}]})}

function triggerNPCArcs(name,oldAff,newAff){const npc=state.npcs[name],tmpl=NPC_TEMPLATES[name];for(const threshold of [30,60,90]){if(oldAff<threshold&&newAff>=threshold){if(npc.arcsTriggered.includes(threshold))continue;npc.arcsTriggered.push(threshold);const arc=tmpl.arcs[threshold];if(arc)log("friend",`※ ${arc}`);const gift=tmpl.gifts[threshold];if(gift){if(gift[0]==="青锋飞剑"&&(!state.weapon||EQUIP[state.weapon].atk<35)){state.weapon="青锋飞剑";log("special",`※ ${name}赠你青锋飞剑!`)}else{addItem(state,gift[0],gift[1]);log("special",`※ ${name}赠你 ${gift[0]} ×${gift[1]}!`)}}if(name==="陆景行"&&threshold===90&&!state.partner){setTimeout(()=>{openModal({title:"道 侣",sub:"心之所向",body:`陆景行向你递出同心玉佩。\n\n你愿与他结为道侣,相携走完这修仙长路吗?`,choices:[{label:"愿意结为道侣",hint:"携手前行",action:()=>{state.partner="陆景行";state.maxLifespan+=30;state.daoHeart=Math.min(100,state.daoHeart+15);log("special","※※ 你与陆景行结为道侣!寿元 +30,道心 +15。");closeModal();render()}},{label:"修仙路漫,不敢承诺",hint:"婉拒之",action:()=>{npc.affinity=Math.max(0,npc.affinity-20);log("sad","你婉拒了他的心意。陆景行神色黯然,转身而去。");closeModal();render()}}]})},100)}}}}

"daoist_friend":(s)=>{s.daoHeart=Math.min(100,s.daoHeart+6);const g=Math.floor((20+rand(0,25)*(s.realm+1))*getExpBonus(s));s.exp+=g;return{text:`偶遇一道友切磋论道,相谈甚欢。修为增长 ${g},道心稳固。`,type:"good"}},
"weapon_find":(s)=>{const tier=Math.min(s.realm,4);const weapons=Object.entries(EQUIP).filter(([k,v])=>v.slot==="weapon"&&v.minRealm===tier);if(weapons.length===0)return{text:"探得一处古迹,未见适合自己的法器。",type:""};const[name,info]=weapons[0];if(s.weapon&&EQUIP[s.weapon].atk>=info.atk)return{text:`你寻得 ${name},但于你已无大用,留下未取。`,type:""};s.weapon=name;return{text:`你于古迹中得 ${name}(攻击+${info.atk}),即刻佩戴。`,type:"special"}},

"mystic_phoenix":(s)=>{s.daoHeart=Math.min(100,s.daoHeart+12);const g=Math.floor((250+rand(0,250)*(s.realm+1))*getExpBonus(s));s.exp+=g;addItem(s,"驻颜丹",1);return{text:`你在仙岛之上,亲见一只朱羽凤凰自云中飞过。心境澄澈,修为 +${g},道心 +12,意外得驻颜丹一枚。`,type:"mystic"}},
"ghost_market":(s)=>{const cost=200+s.realm*300;if(s.spiritStones<cost)return{text:"九幽冥土的鬼市灯火幽幽,你囊中不足,未敢久留。",type:""};return{text:`鬼市中,一阴森老者兜售一颗『阴煞丹』。开价 ${cost} 灵石。`,type:"",choices:[{label:`购买(${cost}灵石)`,hint:"未知风险",do:()=>{s.spiritStones-=cost;if(chance(60)){const g=Math.floor((250+rand(0,250)*(s.realm+1))*getExpBonus(s));s.exp+=g;return{text:`阴煞丹入腹,修为暴增 ${g} 点!`,type:"special"}}else{s.daoHeart=Math.max(0,s.daoHeart-15);const dmg=Math.floor(s.maxHp*0.3);s.hp=Math.max(1,s.hp-dmg);return{text:`阴煞丹竟有副作用,道心受损 15,气血损 ${dmg}!`,type:"bad"}}}},{label:"不买",hint:"",do:()=>({text:"你心生警惕,匆匆离开鬼市。",type:""})}]}},
"dark_treasure":(s)=>{if(chance(50)){addItem(s,"高阶灵草",2);addItem(s,"妖丹",1);s.spiritStones+=500;return{text:`你于阴气浓郁处寻得一处宝藏,得灵草、妖丹及大量灵石!`,type:"special"}}else{const dmg=Math.floor(s.maxHp*0.3);s.hp=Math.max(1,s.hp-dmg);return{text:`所谓宝藏竟是邪修陷阱,你受阴气侵袭,损血 ${dmg}。`,type:"bad"}}}

function openCombat(enemy,opts){opts=opts||{};combatState={enemy,turn:0,log:[],spar:!!opts.spar,onWin:opts.onWin||null,onLose:opts.onLose||null,title:opts.title||"对 敌"};renderCombat()}
function combatPlayerTurn(action,item){const e=combatState.enemy;const playerAtk=getCurrentAtk(state);const playerDef=getCurrentDef(state);let playerActed=false;if(action==="attack"){let dmg=Math.max(1,playerAtk-e.def+rand(-5,5));if(chance(getCritChance(state))){dmg=Math.floor(dmg*2);combatState.log.push({t:"special",x:`暗影涌动,你的一击造成暴击!`})}e.hp-=dmg;combatState.log.push({t:"good",x:`你出剑攻击 ${e.name},造成 ${dmg} 伤害。`});playerActed=true}else if(action==="skill"){const cost=Math.floor(state.maxMp*0.3);if(state.mp<cost){combatState.log.push({t:"bad",x:`法力不足!`});renderCombat();return}state.mp-=cost;const dmg=Math.max(1,Math.floor(playerAtk*getSkillMult(state))-e.def+rand(-5,10));e.hp-=dmg;combatState.log.push({t:"special",x:`你催动法术,法力消耗 ${cost},对 ${e.name} 造成 ${dmg} 伤害!`});playerActed=true}else if(action==="item"){if(!ITEMS[item]||!ITEMS[item].use){combatState.log.push({t:"bad",x:`${item} 无法在此使用。`});renderCombat();return}if(!removeItem(state,item,1)){combatState.log.push({t:"bad",x:`没有 ${item}。`});renderCombat();return}const msg=ITEMS[item].use(state);combatState.log.push({t:"good",x:`服用 ${item}:${msg}`});playerActed=true}else if(action==="flee"){const fleeChance=50+state.daoHeart/4+getFleeBonus(state);if(chance(fleeChance)){combatState.log.push({t:"",x:`你拼力遁走,脱离了战场。`});log("",`你在与 ${e.name} 的交手中遁走。`);combatState=null;closeModal();afterAction();return}else{combatState.log.push({t:"bad",x:`遁走失败!`});playerActed=true}}if(e.hp<=0){if(combatState.spar){const cb=combatState.onWin;combatState=null;closeModal();if(cb)cb();else afterAction();return;}let txt=`※ 你击败了 ${e.name}!获得修为 ${e.exp}。`;state.exp+=Math.floor(e.exp*getExpBonus(state));if(e.drops){e.drops.forEach(([item,count])=>{if(item==="灵石"){state.spiritStones+=count;txt+=` 灵石 ×${count}。`}else{addItem(state,item,count);txt+=` ${item} ×${count}。`}})}log("combat",txt);combatState=null;closeModal();checkSectGifts();afterAction();return}if(playerActed){if(state.spec==="medicine"&&state.hp>0&&state.hp<state.maxHp){const h=Math.floor(state.maxHp*0.07)+1;state.hp=Math.min(state.maxHp,state.hp+h);combatState.log.push({t:"good",x:`医道自渡,回复气血 ${h}。`});}const dmg=Math.max(1,e.atk-playerDef+rand(-5,5));state.hp-=dmg;combatState.log.push({t:"bad",x:`${e.name} 反击!你受到 ${dmg} 伤害。`});if(state.hp<=0){state.hp=0;if(combatState.spar){const cb=combatState.onLose;combatState=null;closeModal();if(cb)cb();else afterAction();return;}if(state.inventory["回春丹"]&&state.inventory["回春丹"]>0){removeItem(state,"回春丹",1);state.hp=Math.floor(state.maxHp*0.5);combatState.log.push({t:"special",x:`命悬一线之际,回春丹自动炸开,将你救回半数气血!`})}else{state.alive=false;log("bad",`※ 你战死于 ${e.name} 之手。修仙路至此终结。`);combatState=null;closeModal();afterAction();return}}}combatState.turn++;renderCombat()}

// ============== UI ==============
function afterAction(){
  saveStateAsync();
  if(!state.alive){setTimeout(()=>render(),200);return;}
  if(combatState===null&&modalStack.length===0){if(!checkSpecChoice()&&!checkTournament()&&!checkTombExpedition()&&!checkEraEvent())checkFeud();}
  render();
}

function render(){
  const scrollY=window.scrollY;
  const app=document.getElementById("app");
  if(state===null){app.innerHTML=renderStart();bindStart();window.scrollTo(0,scrollY);return}
  if(!state.alive){app.innerHTML=renderEnding();bindEnding();window.scrollTo(0,scrollY);return}
  if(state.flags&&state.flags.rival)syncRival();
  app.innerHTML=renderGame();
  bindGame();
  window.scrollTo(0,scrollY);
  requestAnimationFrame(()=>window.scrollTo(0,scrollY));
  const logEl=document.getElementById("logPanel");
  if(logEl)logEl.scrollTop=logEl.scrollHeight;
}

function renderStart(){return `<div class="start-screen"><h1>寻道</h1><div class="subtitle">凡 人 修 仙</div><div class="opening">天地有灵,万物可修。<br>你是落霞镇外一户人家的女儿,<br>命中带有修行之缘——<br>且看你能否在这浩瀚仙途之上,<br>一步步行至那飞升之境。</div><input id="nameInput" placeholder="请输入你的名字" maxlength="6"/><button class="start-btn" id="startBtn">开 始 修 行</button></div>`}

function bindStart(){document.getElementById("startBtn").onclick=()=>{const name=document.getElementById("nameInput").value.trim()||"无名";startCeremony(name)}}

/* ===== 灵根测试开场仪式 ===== */
let ceremonyData=null;
function startCeremony(name){
  ceremonyData={name,rolled:rollSpiritRoot(),step:0};
  renderCeremony();
}
function ceremonyGlow(elements){
  const stops=elements.map((el,i)=>{const h=ELEMENT_HEX[el]||"#d4af37";const p=elements.length===1?0:Math.round(i/(elements.length-1)*100);return `${h} ${p}%`;});
  const glow=ELEMENT_HEX[elements[0]]||"#d4af37";
  const bg=elements.length===1
    ? `radial-gradient(circle at 45% 40%, ${stops[0].split(' ')[0]}, rgba(0,0,0,.2) 72%)`
    : `conic-gradient(from 210deg, ${elements.map(el=>ELEMENT_HEX[el]||'#d4af37').join(',')}, ${ELEMENT_HEX[elements[0]]||'#d4af37'})`;
  return {bg,glow};
}
function renderCeremony(){
  const app=document.getElementById("app");
  const {name,rolled,step}=ceremonyData;
  const root=rolled.root, elements=rolled.elements;
  const info=ROOT_CEREMONY[root.name]||{tier:"",react:root.desc};
  let inner="";
  if(step===0){
    inner=`<div class="cer-scene">青 云 山 · 测 灵 大 典</div>
    <div class="cer-text">三年一度的测灵大典,今日于青云山广场举行。数百名如你一般的少年男女自四乡八里赶来,只为在那方古老的<span class="em">测灵石</span>上,验一验自己有无踏入仙途的资格。<br><br>队伍缓缓向前。终于,轮到了你。</div>
    <button class="cer-btn" id="cerNext">上 前</button>`;
  }else if(step===1){
    inner=`<div class="cer-scene">测 灵 石 前</div>
    <div class="cer-text">主持大典的白发长老抬眼看你,示意你将手掌按上石面。<br><br>那石通体玄黑,触手冰凉,似有若无地传来一缕古老的心跳。<br><br><span class="whisper">「凝神,静气。将你心底那一点念想,交给它。」</span></div>
    <div class="cer-orb dim"><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="core"></div></div>
    <button class="cer-btn" id="cerNext">按 上 手 掌</button>`;
  }else if(step===2){
    const g=ceremonyGlow(elements);
    inner=`<div class="cer-scene">光 华 大 盛</div>
    <div class="cer-orb" style="background:${g.bg};box-shadow:0 0 60px ${g.glow},0 0 120px ${g.glow}66;"><div class="ring" style="border-color:${g.glow}55"></div><div class="ring" style="border-color:${g.glow}44"></div><div class="ring" style="border-color:${g.glow}33"></div><div class="core"></div></div>
    <div class="cer-root-name spirit-root-${root.name}" style="color:${g.glow};">${root.name}</div>
    <div class="cer-text" style="margin-top:10px;">${info.react}</div>
    <button class="cer-btn" id="cerNext">…</button>`;
  }else if(step===3){
    const elHtml=elements.map((el,i)=>`<span class="element-tag ${ELEMENT_INFO[el].color}" style="animation-delay:${i*0.18}s">${el} · ${ELEMENT_INFO[el].desc}</span>`).join('');
    inner=`<div class="cer-scene">灵 根 属 性</div>
    <div class="cer-text">长老收回目光,提笔在名册上记下你的名字。<br>你的灵根,含<span class="em">${elements.length}</span>种属性:</div>
    <div class="cer-elements">${elHtml}</div>
    <div class="cer-text" style="margin-top:18px;">「资质在天,勤惰在人。」老者的声音很轻,却字字入心,<br>「打今日起,你便是青云山的记名弟子了。去吧,${name}。」</div>
    <button class="cer-btn" id="cerNext">踏 入 仙 途</button>`;
  }
  app.innerHTML=`<div class="ceremony">${inner}${step<3?'<button class="cer-skip" id="cerSkip">‹ 跳过仪式 ›</button>':''}</div>`;
  const nextBtn=document.getElementById("cerNext");
  if(nextBtn)nextBtn.onclick=()=>{
    if(ceremonyData.step>=3){finishCeremony();}
    else{ceremonyData.step++;renderCeremony();}
  };
  const skip=document.getElementById("cerSkip");
  if(skip)skip.onclick=()=>finishCeremony();
}
function finishCeremony(){
  const {name,rolled}=ceremonyData;
  ceremonyData=null;
  newGame(name,rolled);
  saveStateAsync();
  render();
}

</div>
<div class="panel log-panel" id="logPanel">${state.log.slice(-30).map(e=>`<div class="log-entry log-${e.type||''}"><span class="log-time">${e.age}岁</span>${e.text}</div>`).join('')}</div>
<div class="actions">

function bindGame(){document.getElementById("cultivateBtn").onclick=actCultivate;document.getElementById("adventureBtn").onclick=actAdventure;document.getElementById("secludeBtn").onclick=actSeclude;document.getElementById("travelBtn").onclick=actTravel;document.getElementById("socialBtn").onclick=actSocial;document.getElementById("invBtn").onclick=openInventory;document.getElementById("bkBtn").onclick=actBreakthrough;document.getElementById("specBtn").onclick=openSpecPanel;document.getElementById("statusBtn").onclick=actStatus;document.getElementById("resetBtn").onclick=()=>{openModal({title:"重启",body:"确认重启吗?当前进度将永久消失。",choices:[{label:"确认重启",hint:"不可逆",action:()=>{closeModal();resetState()}},{label:"取消",hint:"",action:()=>{closeModal();render()}}]})}}

/* ===== 择道 & 专精技艺 ===== */
function checkSpecChoice(){
  if(!state.alive||state.spec||state.flags.specOffered)return false;
  if(state.realm>=1||(state.realm===0&&state.stage>=6)){
    state.flags.specOffered=true;
    openSpecChoice(false);
    return true;
  }
  return false;
}
function openSpecChoice(manual){
  const intro=`练气有成,道基初显。青云山有例:弟子至此,须于剑、体、丹、器、医五道之中,择一主修,是为『择道』。\n\n此后你仍可修行诸般,但主修之道将伴你一生,深植于骨血。慎择之。`;
  const choices=Object.entries(SPECS).map(([id,sp])=>{
    const rec=sp.reco(state.elements);
    return {label:`${sp.icon} ${sp.name} · ${sp.short}${rec?"  ★":""}`,hint:`${sp.bonus}`,action:()=>chooseSpec(id)};
  });
  if(manual)choices.push({label:"再想想",hint:"",action:()=>{closeModal();render()}});
  openModal({title:"择 道",sub:"剑 · 体 · 丹 · 器 · 医",body:intro+"\n\n(★ 为你的灵根所宜之道)",choices});
}
function chooseSpec(id){
  const sp=SPECS[id];
  state.spec=id;
  applyRealmStats(state);
  state.hp=state.maxHp;state.mp=state.maxMp;
  log("special",`※※ 你立于道前,择『${sp.name}』为主修。自此,${sp.short}。`);
  state.remembered=state.remembered||[];
  closeModal();
  // 每道赠予入门之物/心法
  if(id==="alchemy"){addItem(state,"低阶灵草",4);log("friend","※ 丹堂长老赠你灵草四株,并授《青囊丹经》入门篇:「炼丹先炼心,火候即道心。」")}
  else if(id==="artifact"){addItem(state,"妖丹",1);log("friend","※ 器堂长老赠你妖丹一枚:「器由心生,一锤一炼,皆是修行。」")}
  else if(id==="medicine"){addItem(state,"回春丹",2);log("friend","※ 医堂长老赠你回春丹二枚:「医者,先医己心,再医苍生。」")}
  else if(id==="sword"){log("combat","※ 剑堂长老掷来一道剑诀:「剑者,一往无前,再无退路。」你的杀伐之力大涨。")}
  else if(id==="body"){log("good","※ 体堂长老拍你肩背,一股精纯气血涌入四肢百骸:「淬体千锤,不惧雷霆。」")}
  afterAction();
}

function specActionLabel(){
  if(state.spec==="alchemy")return "炼 丹";
  if(state.spec==="artifact")return "炼 器";
  if(state.spec==="medicine")return "施 医";
  if(state.spec==="sword")return "剑 冢";
  if(state.spec==="body")return "淬 体";
  return "择 道";
}
function openSpecPanel(){
  if(!state.spec){
    if(state.realm>=1||(state.realm===0&&state.stage>=6)){state.flags.specOffered=true;openSpecChoice(true);}
    else toast("练气后期(七层)方可择道主修");
    return;
  }
  if(state.spec==="alchemy")return openAlchemy();
  if(state.spec==="artifact")return openForge();
  if(state.spec==="medicine")return openHeal();
  if(state.spec==="sword")return specSwordTemper();
  if(state.spec==="body")return specBodyTemper();
}
function matsText(mats){return mats.map(([m,n])=>{const have=m==="灵石"?state.spiritStones:(state.inventory[m]||0);return `${m}×${n}(有${have})`}).join("、")}
function hasMats(mats){return mats.every(([m,n])=>(m==="灵石"?state.spiritStones:(state.inventory[m]||0))>=n)}
function payMats(mats){mats.forEach(([m,n])=>{if(m==="灵石")state.spiritStones-=n;else removeItem(state,m,n)})}
function refundStones(mats){mats.forEach(([m,n])=>{if(m==="灵石")state.spiritStones+=n})}

function openAlchemy(){
  const avail=ALCHEMY_RECIPES.filter(r=>state.realm>=r.realm);
  const choices=avail.map(r=>{const ok=hasMats(r.mats);return {label:`炼制 ${r.make}`,hint:`${matsText(r.mats)}${ok?"":" · 材料不足"}`,disabled:!ok,action:()=>doAlchemy(r)}});
  choices.push({label:"离炉",hint:"",action:()=>{closeModal();render()}});
  openModal({title:"炼 丹",sub:"炉火纯青",body:`丹炉温热,药香扑鼻。以灵材入炉,可炼济世之丹。\n\n道心愈高,成丹愈稳。丹修之身,成丹率极高。`,choices});
}
function doAlchemy(r){
  if(!hasMats(r.mats)){toast("材料不足");return}
  payMats(r.mats);passSeasons(1);
  let rate=Math.min(98,60+state.daoHeart/2+35-r.realm*6);
  if(chance(rate)){addItem(state,r.make,r.n);log("special",`※ 丹成!炉盖开处,一颗 ${r.make} 腾空而起,被你稳稳收入囊中。`);const bonus=r.make==="九转还魂丹"?"":"";}
  else{refundStones(r.mats);state.daoHeart=Math.max(0,state.daoHeart-2);log("bad",`※ 火候失了几分,丹药炸炉,灵材尽毁(灵石已退还)。`)}
  afterAction();
}
function openForge(){
  const avail=FORGE_RECIPES.filter(r=>state.realm>=r.realm);
  const choices=avail.map(r=>{const ok=hasMats(r.mats);const info=EQUIP[r.out];const cur=r.slot==="weapon"?state.weapon:state.armor;const curV=cur?(r.slot==="weapon"?EQUIP[cur].atk:EQUIP[cur].def):0;const newV=r.slot==="weapon"?info.atk:info.def;const better=newV>curV;return {label:`锻造 ${r.out}`,hint:`${r.slot==="weapon"?"攻+"+info.atk:"防+"+info.def} · ${matsText(r.mats)}${!ok?" · 材料不足":(better?"":" · 不及现有")}`,disabled:!ok,action:()=>doForge(r)}});
  choices.push({label:"熄炉",hint:"",action:()=>{closeModal();render()}});
  openModal({title:"炼 器",sub:"点石成器",body:`地火熊熊,铁砧微鸣。以妖丹为引、灵石为薪,可锻法宝兵甲。\n\n锻成后若胜过现有,自动换上。`,choices});
}
function doForge(r){
  if(!hasMats(r.mats)){toast("材料不足");return}
  payMats(r.mats);passSeasons(1);
  let rate=Math.min(96,55+state.daoHeart/2+30-r.realm*6);
  if(chance(rate)){
    const info=EQUIP[r.out];const cur=r.slot==="weapon"?state.weapon:state.armor;const curV=cur?(r.slot==="weapon"?EQUIP[cur].atk:EQUIP[cur].def):0;const newV=r.slot==="weapon"?info.atk:info.def;
    if(newV>curV){if(r.slot==="weapon")state.weapon=r.out;else state.armor=r.out;log("special",`※ 器成!一件 ${r.out} 于炉中淬火而出,寒光凛冽。你当即${r.slot==="weapon"?"佩上":"披上"}。`);}
    else{addItem(state,r.out,1);log("good",`※ 器成:${r.out}。然不及你现有之物,暂收入囊。`)}
  }else{refundStones(r.mats);log("bad",`※ 淬火之际炸裂,妖丹化为灰烬(灵石已退还)。`)}
  afterAction();
}
function openHeal(){
  openModal({title:"施 医",sub:"悬壶济世",body:`你可坐堂施医,救治山下往来的病者伤患。\n\n既疗己身,亦积功德,道心因之而固。`,choices:[
    {label:"坐堂施医(1 季)",hint:"回满气血、道心+、得诊金",action:()=>{
      const gain=3+rand(0,4);state.daoHeart=Math.min(100,state.daoHeart+gain);state.hp=state.maxHp;state.mp=state.maxMp;const fee=20*(state.realm+1)+rand(0,30);state.spiritStones+=fee;passSeasons(1);
      log("friend",`你于坊间坐堂,救治病患数十。气血尽复,道心 +${gain},得诊金 ${fee} 灵石。`);
      if(chance(12)){addItem(state,"中阶灵草",1);log("good","※ 一位痊愈的老药农,执意塞给你一株亲种的灵草。")}
      closeModal();afterAction();
    }},
    {label:"离堂",hint:"",action:()=>{closeModal();render()}}
  ]});
}
function specSwordTemper(){
  openModal({title:"剑 冢",sub:"以剑养剑",body:`剑修不假外力,唯以战养剑。你可入剑冢,与冢中残留的剑意搏杀一场,磨砺剑心。`,choices:[
    {label:"入冢磨剑(1 季)",hint:"修为增长、有暴击悟性",action:()=>{
      const g=Math.floor((30+rand(0,40)*(state.realm+1))*getExpBonus(state));state.exp+=g;passSeasons(1);

      if(chance(15)){state.daoHeart=Math.min(100,state.daoHeart+3);log("mystic","※ 电光石火间,你窥见一线剑道真意。道心 +3。")}
      closeModal();afterAction();
    }},{label:"出冢",hint:"",action:()=>{closeModal();render()}}
  ]});
}
function specBodyTemper(){
  openModal({title:"淬 体",sub:"千锤百炼",body:`体修之道,在于将己身当作法宝反复锤炼。你可行淬体之法,以苦楚换雄浑气血。`,choices:[

const TOURNEY_FOES=[
  {name:"赵霜",line:"「山野来的丫头也配上场?让你三招。」"},
  {name:"孙慕白",line:"「点到为止,姑娘小心了。」"},
  {name:"周执",line:"「我练剑十年,不会输给你。」"},
  {name:"吴细雨",line:"「承让,承让,可我也不会手软。」"},
  {name:"郑破军",line:"「破军一出,寸草不生!」"},
  {name:"冯月泠",line:"「你眼里有火。有意思。」"},

];
const TOURNEY_ROUNDS=["初 赛","复 赛","半决赛","决 赛"];
let tourney=null;
function ensureRival(){
  if(!state.flags.rival)state.flags.rival={name:"江照白",met:false,playerWins:0,playerLosses:0,respect:0};
  return state.flags.rival;
}
function checkTournament(){
  if(!state.alive||state.location!=="青云山"||tourney)return false;
  if(state.realm>3)return false; // 大比是弟子辈之事,元婴后不再参与
  const next=state.flags.nextTournamentAge!=null?state.flags.nextTournamentAge:(state.age+1);
  if(state.flags.nextTournamentAge==null)state.flags.nextTournamentAge=next;
  if(state.age>=next){openTournamentAnnounce();return true;}
  return false;
}
function openTournamentAnnounce(){
  ensureRival();
  const body=`青云山钟声九响,三年一届的『宗门大比』又至。\n\n山门广场早已人山人海,内外门弟子皆可登台一较高下。胜者不仅有灵石丹药之赏,更能扬名立万,得长老青眼。\n\n你,要上场吗?`;
  openModal({title:"宗 门 大 比",sub:"三年一届",body,choices:[
    {label:"登台一战",hint:"四轮晋级,愈战愈强",action:()=>{closeModal();tourneyStart();}},
    {label:"今年不了",hint:"三年后再来",action:()=>{state.flags.nextTournamentAge=state.age+3;closeModal();render();}}
  ]});
}
function tourneyStart(){
  state.hp=state.maxHp;state.mp=state.maxMp;
  tourney={round:0,wins:0,used:[]};
  const cheer=[];
  if(state.npcs["林若雪"]&&state.npcs["林若雪"].status==="alive")cheer.push("林若雪挤在人群最前排,举着手臂喊你的名字");
  if(state.npcs["陆景行"]&&state.npcs["陆景行"].status==="alive")cheer.push("陆景行抱剑立于场边,只朝你微微颔首");

function pickFoe(){
  const avail=TOURNEY_FOES.filter(f=>!tourney.used.includes(f.name));
  const f=avail.length?avail[rand(0,avail.length-1)]:TOURNEY_FOES[rand(0,TOURNEY_FOES.length-1)];
  tourney.used.push(f.name);return f;
}
function makeTourneyFoe(round,isRival){
  const pAtk=getCurrentAtk(state),pDef=getCurrentDef(state),pHp=state.maxHp;
  const hpMul=[0.6,0.85,1.1,1.4][round]*(isRival?1.15:1);
  const atkF=[0.5,0.65,0.8,0.95][round]*(isRival?1.12:1);
  const defF=[0.25,0.38,0.5,0.6][round]*(isRival?1.1:1);
  const hp=Math.max(40,Math.floor(pHp*hpMul));
  const atk=Math.max(5,Math.floor((pDef+pAtk*0.35)*atkF));
  const def=Math.max(2,Math.floor(pAtk*defF));
  return {hp,maxHp:hp,atk,def,exp:0,drops:[]};
}
function tourneyBeginRound(){
  const round=tourney.round;
  const isFinal=round===3;
  const rival=ensureRival();
  let foeName,foeLine;
  if(isFinal){foeName=rival.name;foeLine=rivalTaunt();}
  else{const f=pickFoe();foeName=f.name;foeLine=f.line;}
  const foe=makeTourneyFoe(round,isFinal);foe.name=foeName;
  const heal=round>0?"\n\n(执事递来温水与丹药,你气血回复如初。)":"";
  state.hp=state.maxHp;state.mp=state.maxMp;
  let intro=`【${TOURNEY_ROUNDS[round]}】 对阵 ${foeName}`;
  if(isFinal&&!rival.met){rival.met=true;intro+=`\n\n压轴登场的,是本届呼声最高的天才少女——${rival.name}。天灵根之资,入门不过数载已冠绝同侪。她扫了你一眼,那目光里没有敌意,只有一种理所当然的俯视。`;}
  intro+=`\n\n${foeName}:${foeLine}${heal}`;
  openModal({title:`大比 · ${TOURNEY_ROUNDS[round]}`,sub:isFinal?"决 战":"",body:intro,choices:[
    {label:"出 手",hint:isFinal?"胜负在此一举":"点到为止",action:()=>{closeModal();openCombat(foe,{spar:true,title:`大比 · 对阵${foeName}`,onWin:tourneyWin,onLose:tourneyLose});}}
  ]});
}
function rivalTaunt(){
  const r=state.flags.rival;
  const lowRoot=["四灵根","五灵根"].includes(state.spiritRoot);
  if(r.respect>=50)return "「又是你。……这一次,我不会再留手了。」";
  if(r.respect>=25)return "「你这样的资质,竟也走到了这里。倒让我有些期待。」";
  if(lowRoot)return "「就凭你那点灵根,也想站在我对面?退下吧,别丢人。」";
  return "「无名之辈。三招之内,我送你下台。」";
}
function tourneyWin(){
  tourney.wins++;

  log("combat",`※ 大比 ${TOURNEY_ROUNDS[tourney.round]}:你击败了 ${foe}!`);
  if(tourney.round>=3){tourneyFinish(true);return;}
  tourney.round++;
  const lines=["台下爆发出一阵喝彩。","执事高声报出你的名字,你听见有人在为你欢呼。","你收剑而立,对手抱拳:「承让。」"];
  openModal({title:"晋 级",sub:`已胜 ${tourney.wins} 场`,body:lines[rand(0,lines.length-1)]+`\n\n下一轮:${TOURNEY_ROUNDS[tourney.round]}。`,choices:[
    {label:"继续晋级",hint:"",action:()=>{closeModal();tourneyBeginRound();}},
    {label:"见好就收",hint:"以当前战绩领赏",action:()=>{closeModal();tourneyFinish(false);}}
  ]});
}
function tourneyLose(){
  const foe=tourney.round===3?state.flags.rival.name:(tourney.used[tourney.used.length-1]||"对手");

function tourneyFinish(wonFinal){

  }else if(wins>=3){
    place="亚 军";stones=200*rm+rand(0,120);addItem(state,"玉简",1);state.daoHeart=Math.min(100,state.daoHeart+4);
    body=`你一路杀入决赛,终究败下阵来。虽败犹荣。台下的喝彩,有一半是给你的。`;
    log("good",`※ 你获宗门大比亚军!赏灵石 ${stones}、玉简×1,道心 +4。`);
  }else if(wins>=2){
    place="四 强";stones=120*rm+rand(0,80);addItem(state,"回春丹",2);
    body=`你闯入四强,已胜过场上绝大多数人。长老记住了你这张脸。`;
    log("good",`※ 你止步宗门大比四强,赏灵石 ${stones}、回春丹×2。`);
  }else if(wins>=1){
    place="十六强";stones=60*rm+rand(0,40);
    body=`你赢下一场,又输了一场。台下人潮很快涌向下一个名字,但你知道,自己离那座高台又近了一点。`;
    log("",`※ 你于宗门大比止步十六强,赏灵石 ${stones}。`);
  }else{
    place="首轮出局";stones=20*rm;
    body=`你第一轮便被淘汰。走下高台时,人群的目光早已越过你,望向别处。\n\n没关系。三年后,还有下一届。`;
    log("sad",`※ 你于宗门大比首轮出局,得安慰灵石 ${stones}。`);
  }
  state.spiritStones+=stones;
  state.flags.nextTournamentAge=state.age+10;
  const wonTourney=tourney;tourney=null;

  openModal({title:place,sub:"宗门大比",body,choices:[{label:"步下高台",hint:"",action:()=>{closeModal();afterAction();}}]});

function checkTombExpedition(){

function tombFoe(diff){

let eraActive=false;
function killNpc(name,reason){const npc=state.npcs[name];if(npc&&npc.status==="alive"){npc.status="dead";npc.statusReason=reason;npc.deathAge=npc.age;state.remembered=state.remembered||[];state.remembered.push(`${state.age}岁,${name}${reason}。`);return true;}return false;}
function livingMortalFriends(){return Object.keys(state.npcs).filter(n=>NPC_TEMPLATES[n]&&NPC_TEMPLATES[n].isMortal&&state.npcs[n].status==="alive");}
function livingCultFriends(){return Object.keys(state.npcs).filter(n=>NPC_TEMPLATES[n]&&!NPC_TEMPLATES[n].isMortal&&state.npcs[n].status==="alive");}
function eraFoe(spec){const pAtk=getCurrentAtk(state),pDef=getCurrentDef(state),pHp=state.maxHp;const hp=Math.max(80,Math.floor(pHp*spec.hp));return {name:spec.name,hp,maxHp:hp,atk:Math.max(8,Math.floor((pDef+pAtk*0.4)*spec.atk)),def:Math.max(4,Math.floor(pAtk*spec.def)),exp:0,drops:[]};}
function pickHighestAffinity(list){let who=null,best=-1;for(const w of list){const npc=state.npcs[w];if(npc&&npc.affinity>best){best=npc.affinity;who=w;}}return who;}

function checkEraEvent(){
  if(!state.alive||tombState||tourney||eraActive)return false;
  if(modalStack.length>0)return false;
  if(!state.flags.demonDone&&state.realm>=1){
    if(state.flags.demonAge==null)state.flags.demonAge=state.age+rand(2,6);
    if(state.age>=state.flags.demonAge){demonStart();return true;}
  }
  if(!state.flags.realmDone&&state.realm>=2){
    if(state.flags.realmAge==null)state.flags.realmAge=state.age+rand(3,8);
    if(state.age>=state.flags.realmAge){secretRealmStart();return true;}

  return false;
}

  }else{
    addItem(state,"高阶灵草",2);state.spiritStones+=200*(state.realm+1);
    openModal({title:"灵脉福地",sub:"秘境其二",body:`第二重是一片先天灵脉福地,灵草遍野,灵气浓稠得几乎凝成水滴。你放开手脚,采撷了一番,满载而行。`,choices:[{label:"深入第三重",hint:"",action:()=>{closeModal();secretRealmS3();}}]});
  }
}
function secretRealmS3(){
  openModal({title:"上古传承殿",sub:"秘境其三",body:`最深处,是一座悬浮的玉殿。殿中一枚光茧静静旋转,里面封存着这方洞天主人的毕生传承。\n\n光茧上有古老的意志低语:『有缘者,可承吾道——但需以本心相印。』`,choices:[
    {label:"以本心叩问传承",hint:"考验道心/根骨",action:()=>{closeModal();const good=chance(35+state.daoHeart/2+(["天灵根","变异灵根","单灵根"].includes(state.spiritRoot)?20:0));if(good){addItem(state,"玉简",3);state.maxLifespan+=30;state.daoHeart=Math.min(100,state.daoHeart+6);const g=Math.floor(300*(state.realm+1)*getExpBonus(state));state.exp+=g;log("special",`※※ 光茧应你本心而绽!上古传承如江河灌入识海。你得功法真意(玉简×3)、寿元 +30、修为 +${g}。`);state.flags.realmInherit=true;}else{const g=Math.floor(120*(state.realm+1)*getExpBonus(state));state.exp+=g;log("mystic",`※ 你与这道传承终究缘分尚浅,只窥得皮毛,得修为 +${g}。`);}secretRealmEnd();}},
    {label:"不取传承,只求无愧",hint:"淡泊",action:()=>{closeModal();state.daoHeart=Math.min(100,state.daoHeart+12);log("mystic",`※ 你朝光茧长揖一礼,转身离去。「求道之人,不该为宝物折了本心。」道心 +12。`);secretRealmEnd();}}
  ]});
}
function secretRealmEnd(){
  state.flags.realmDone=true;
  state.flags.realmAge=state.age+9999;
  state.remembered=state.remembered||[];
  state.remembered.push(`${state.age}岁,你入过一次上古洞天,见过那里的仙草与传承,也见过自己的心魔。`);
  openModal({title:"洞 天 将 闭",sub:"纪元大事件 · 尾声",body:`洞天开始收缩,虚空震颤。你随着退潮的人流,在裂隙彻底闭合前一刻,跃了出来。\n\n身后,那方小天地无声地坍缩成一点星光,消失在夜幕里。千年之后,它或许会再度开启——但那时的你,又会在哪里呢?`,choices:[{label:"回望一眼,归去",hint:"",action:()=>eraEnd()}]});
}

/* ===== 爱恨情仇:宿敌江照白 & 血仇厉无咎 ===== */
function syncRival(){
  const r=state.flags&&state.flags.rival;
  if(!r||!r.met)return;
  if(!state.npcs["江照白"])initNPC(state,"江照白");
  const npc=state.npcs["江照白"];
  if(npc&&npc.status==="alive")npc.affinity=Math.max(0,Math.min(100,r.respect));
}
function visitRival(){
  const r=state.flags.rival;const npc=state.npcs["江照白"];
  if(!npc||npc.status!=="alive"){toast("江照白已不在了。");return;}
  const rp=r.respect;
  let mood;
  if(state.partner==="江照白")mood="她见你来,眼角眉梢都是掩不住的暖意:「怎么,想我了?」";
  else if(rp>=75)mood="她倚剑而立,望着你的目光里,有一种她自己也未必察觉的柔软。";
  else if(rp>=50)mood="「是你啊。」她难得地没有摆出那副拒人千里的架势。";
  else if(rp>=25)mood="她瞥你一眼,冷哼一声,却没有走开。";
  else mood="「无名之辈,又来做什么?」她眼里满是倨傲。";
  const choices=[];
  choices.push({label:"论剑一场",hint:"以剑相交,增进相知",action:()=>{closeModal();rivalDuel();}});
  if(rp>=40)choices.push({label:"把酒言欢",hint:"敬彼此为对手",action:()=>{closeModal();r.respect=Math.min(100,r.respect+4);state.daoHeart=Math.min(100,state.daoHeart+2);passSeasons(1);log("friend","你与江照白对坐痛饮,从剑道谈到生死。这世上,能与你这样说话的人,不多了。");afterAction();}});
  if(rp>=75&&!state.partner)choices.push({label:"剖白心迹",hint:"道一句藏了很久的话",action:()=>{closeModal();rivalConfess();}});
  choices.push({label:"出言讥讽",hint:"伤人,亦伤情",action:()=>{closeModal();r.respect=Math.max(-20,r.respect-15);log("bad","你说了几句刻薄话。江照白脸色一沉:「……我当你是对手,你却这般小气。」");if(r.respect<0&&!r.hostile){r.hostile=true;log("sad","※ 江照白拂袖而去。有些裂痕,一旦生了,便再难弥合。");}afterAction();}});
  choices.push({label:"就此别过",hint:"",action:()=>{closeModal();render();}});
  openModal({title:"江 照 白",sub:`相知 ${Math.max(0,rp)}/100${state.partner==="江照白"?" · 道侣":""}`,body:`${npc?realmName(npc.realm,npc.stage)+" · "+npc.age+"岁\n\n":""}${mood}`,choices});
}
function rivalDuel(){
  const foe=eraFoe({name:"江照白",hp:2.0,atk:1.05,def:0.6});
  openCombat(foe,{spar:true,title:"论剑 · 江照白",onWin:()=>{const r=state.flags.rival;r.respect=Math.min(100,r.respect+10);r.playerWins++;log("combat","※ 一番激斗,你险胜半招。江照白收剑,眼中战意更炽:「痛快!下次未必是你赢。」");afterAction();},onLose:()=>{const r=state.flags.rival;r.respect=Math.min(100,r.respect+4);log("combat","※ 你败于她剑下,却也窥见了她的剑道。江照白难得地伸手扶你:「……剑还不错。别气馁。」");afterAction();}});
}
function rivalConfess(){
  openModal({title:"剖 白",sub:"藏了很久的话",body:`夜色里,你终于把那句话说出了口。\n\n江照白怔住了。良久,她别过脸,声音低得几乎听不见:\n\n「……我第一次输给你的时候,就该知道了。」\n\n「这一世的剑,我想和你一起走完。」`,choices:[
    {label:"执子之手",hint:"结为道侣",action:()=>{state.partner="江照白";state.maxLifespan+=30;state.daoHeart=Math.min(100,state.daoHeart+12);state.flags.rival.respect=100;state.remembered=state.remembered||[];state.remembered.push(`${state.age}岁,你与曾经的宿敌江照白,结为道侣。`);log("special","※※ 你与江照白结为道侣!昔日宿敌,今生并肩。寿元 +30,道心 +12。");closeModal();afterAction();}},
    {label:"只愿为友",hint:"止于知己",action:()=>{state.flags.rival.respect=Math.max(60,state.flags.rival.respect);log("sad","你摇了摇头。江照白笑了笑,那笑容里有释然,也有一丝不易察觉的怅惘:「也好。做一辈子对手,也挺好。」");closeModal();afterAction();}}
  ]});
}

/* ---- 血仇:厉无咎 ---- */
function checkFeud(){
  if(!state.alive||eraActive||tombState||tourney||modalStack.length>0)return false;
  const f=state.flags.feud;
  // 起仇
  if(!f&&state.realm>=1){
    if(state.flags.feudAge==null)state.flags.feudAge=state.age+rand(4,10);
    if(state.age>=state.flags.feudAge){feudStart();return true;}
    return false;
  }
  // 寻仇
  if(f&&f.active&&!f.resolved){
    if(f.huntAge==null)state.flags.feud.huntAge=state.age+rand(5,12);
    if(state.age>=state.flags.feud.huntAge){feudHunt();return true;}
  }
  return false;
}
function feudStart(){
  eraActive=true;
  const stolen=Math.floor(state.spiritStones*0.6);state.spiritStones-=stolen;
  let extra="";
  const keys=["筑基丹","金丹妙药","九转还魂丹","妖丹"].filter(k=>state.inventory[k]);
  if(keys.length){const k=keys[0];removeItem(state,k,1);extra=`,连你藏着的 ${k} 也被搜了去`;}
  const dmg=Math.floor(state.maxHp*0.35);state.hp=Math.max(1,state.hp-dmg);
  state.flags.feud={active:true,resolved:false,name:"厉无咎"};
  state.daoHeart=Math.max(0,state.daoHeart-4);
  state.remembered=state.remembered||[];
  state.remembered.push(`${state.age}岁,邪修厉无咎重伤了你、劫了你的财货${extra}。这笔账,你记下了。`);
  log("bad",`※ 你在路上遭一名邪修伏击。那人自称『厉无咎』,笑容阴冷,轻描淡写地打断了你的抵抗,卷走灵石 ${stolen}${extra},临走还踩碎了你的一只灵器。`);
  openModal({title:"结 仇",sub:"厉无咎",body:`「记住我的名字。」他俯身,用剑尖挑起你的下巴,「厉无咎。等你哪天爬得够高了,再来找我报仇——如果你活得到那天的话。」\n\n他大笑着离去,笑声在山谷里回荡了很久。\n\n你趴在血泊里,把这三个字,一寸寸刻进了骨头里。`,choices:[{label:"此仇,不共戴天",hint:"",action:()=>eraEnd()}]});
}
function feudHunt(){
  eraActive=true;
  const f=state.flags.feud;
  openModal({title:"寻 仇",sub:"厉无咎的下落",body:`多年过去,你终于查到了厉无咎的踪迹——他躲在黑风谷深处,如今也修成了不俗的境界,身边还聚了一伙邪修爪牙。\n\n旧伤隐隐作痛。是时候,了结这段因果了。`,choices:[
    {label:"独闯魔窟,手刃仇人",hint:"了断",action:()=>{closeModal();openCombat(eraFoe({name:"厉无咎",hp:2.1,atk:1.08,def:0.6}),{spar:true,title:"寻仇 · 厉无咎",onWin:()=>feudAvenge(),onLose:()=>{state.hp=Math.max(1,Math.floor(state.maxHp*0.2));log("bad","※ 厉无咎技高一筹,你负伤败退。他狞笑着放你一条生路:「再练练吧。」此仇未了。");state.flags.feud.huntAge=state.age+rand(6,12);eraEnd();}});}},
    {label:"时机未到,再等等",hint:"",action:()=>{state.flags.feud.huntAge=state.age+rand(3,6);eraActive=false;closeModal();render();}}
  ]});
}
function feudAvenge(){
  const back=800*(state.realm+1);state.spiritStones+=back;
  openModal({title:"了 断",sub:"厉无咎败于你手",body:`厉无咎跪倒在你剑下,再没了当年的嚣张。他咳着血,惨笑:「想不到……真有这一天。」\n\n你握剑的手,微微发抖。这一刻,你等了很多年。\n\n杀,还是不杀?`,choices:[
    {label:"一剑了结,以慰旧恨",hint:"血债血偿",action:()=>{state.flags.feud.resolved=true;state.flags.feud.active=false;state.daoHeart=Math.max(0,state.daoHeart-3);state.remembered=state.remembered||[];state.remembered.push(`${state.age}岁,你亲手斩了仇人厉无咎。血债已偿,可你心里,并没有想象中痛快。`);log("combat",`※ 剑光落下。厉无咎的头颅滚落尘埃。你夺回了远超当年的财货(灵石 +${back})。大仇得报,你却在原地站了很久很久。`);closeModal();eraEnd();}},
    {label:"收剑,饶他不死",hint:"放下的,是自己",action:()=>{state.flags.feud.resolved=true;state.flags.feud.active=false;state.daoHeart=Math.min(100,state.daoHeart+10);state.remembered=state.remembered||[];state.remembered.push(`${state.age}岁,你本可杀了仇人厉无咎,却在最后一刻收了剑。放过他的那一瞬,你觉得自己好像终于长大了。`);log("mystic",`※ 你收剑入鞘:「你不配我脏了这柄剑。」转身离去时,你觉得压在胸口多年的一块石头,轻轻落了地。道心 +10,夺回财货(灵石 +${back})。`);closeModal();eraEnd();}}
  ]});
}

function openModal(opts){modalStack.push(opts);renderModal()}
function closeModal(){modalStack.pop();renderModal()}
function renderModal(){const existing=document.getElementById("modalBg");if(existing)existing.remove();if(modalStack.length===0)return;const m=modalStack[modalStack.length-1];const bg=document.createElement("div");bg.className="modal-bg";bg.id="modalBg";bg.innerHTML=`<div class="modal"><h3>${m.title||''}</h3>${m.sub?`<div class="modal-sub">${m.sub}</div>`:''}${m.body?`<div class="body" style="white-space:pre-wrap;">${m.body}</div>`:''}${m.html||''}<div class="choices">${(m.choices||[]).map((c,i)=>`<button class="choice" data-i="${i}" ${c.disabled?'disabled':''}>${c.label}${c.hint?`<span class="hint">${c.hint}</span>`:''}</button>`).join('')}</div></div>`;document.body.appendChild(bg);bg.querySelectorAll(".choice").forEach((btn,i)=>{if(!m.choices[i].disabled)btn.onclick=()=>m.choices[i].action()})}

function openInventory(){let html='<div class="inv-grid">';if(state.weapon){const e=EQUIP[state.weapon];html+=`<div class="inv-item"><div><span class="nm">${state.weapon}</span><span class="ds">兵器 · ${e.desc}(攻击+${e.atk})</span></div><span class="ct">已佩戴</span></div>`}if(state.armor){const e=EQUIP[state.armor];html+=`<div class="inv-item"><div><span class="nm">${state.armor}</span><span class="ds">护具 · ${e.desc}(防御+${e.def})</span></div><span class="ct">已穿戴</span></div>`}const entries=Object.entries(state.inventory);if(entries.length===0&&!state.weapon&&!state.armor)html+='<div class="inv-empty">袋中空空如也。</div>';else entries.forEach(([name,count])=>{const it=ITEMS[name];const usable=it&&it.use&&state.alive;html+=`<div class="inv-item"><div><span class="nm">${name}</span><span class="ds">${it?it.desc:''}</span></div><span class="ct">×${count}</span>${usable?`<button data-use="${name}">服用</button>`:''}</div>`});html+='</div>';openModal({title:"背 包",sub:`灵石 ${state.spiritStones}`,body:"",html,choices:[{label:"返回",hint:"",action:()=>{closeModal();render()}}]});setTimeout(()=>{document.querySelectorAll("[data-use]").forEach(btn=>{btn.onclick=()=>{const name=btn.getAttribute("data-use");const it=ITEMS[name];if(!it||!it.use)return;if(!removeItem(state,name,1))return;const msg=it.use(state);log("good",`服用 ${name}:${msg}`);closeModal();afterAction()}})},0)}

function renderCombat(){const e=combatState.enemy;const ehpPct=Math.max(0,(e.hp/e.maxHp)*100);const phpPct=Math.max(0,(state.hp/state.maxHp)*100);const pmpPct=Math.max(0,(state.mp/state.maxMp)*100);const html=`<div class="combat-grid"><div class="combat-side"><h4>${state.name}</h4><div class="bar-bg" style="margin:4px 0;"><div class="bar-fill bar-hp" style="width:${phpPct}%"></div></div><div class="hp">气血 ${state.hp}/${state.maxHp}</div><div class="bar-bg" style="margin:4px 0;"><div class="bar-fill bar-mp" style="width:${pmpPct}%"></div></div><div class="hp" style="color:#6bd0ff;">法力 ${state.mp}/${state.maxMp}</div></div><div class="combat-side"><h4>${e.name}</h4><div class="bar-bg" style="margin:4px 0;"><div class="bar-fill bar-hp" style="width:${ehpPct}%"></div></div><div class="hp">气血 ${e.hp}/${e.maxHp}</div><div class="hp" style="color:#8b7d5c;font-size:11px;margin-top:4px;">攻 ${e.atk} · 防 ${e.def}</div></div></div><div style="max-height:140px;overflow-y:auto;font-size:13px;line-height:1.7;background:rgba(0,0,0,0.25);padding:8px;border-radius:3px;border:1px solid rgba(201,169,110,0.12);">${combatState.log.slice(-6).map(l=>`<div class="log-${l.t}">${l.x}</div>`).join('')||'<div style="color:#6b5d3c;">战斗开始……</div>'}</div>`;const lastChoice=combatState.spar?{label:"认 输",hint:"甘拜下风",action:()=>{const cb=combatState.onLose;combatState=null;closeModal();if(cb)cb();else afterAction();}}:{label:"遁 走",hint:getFleeBonus(state)>0?`风属性 +${getFleeBonus(state)}%`:"尝试脱离战斗",action:()=>combatPlayerTurn("flee")};modalStack=[];modalStack.push({title:combatState.title,sub:getRealmName(state),body:"",html,choices:[{label:"攻 击",hint:`造成约 ${getCurrentAtk(state)-e.def} 伤害${getCritChance(state)>0?`(${getCritChance(state)}%暴击)`:''}`,action:()=>combatPlayerTurn("attack")},{label:`法 术(耗法力 ${Math.floor(state.maxMp*0.3)})`,hint:`造成约 ${Math.floor(getCurrentAtk(state)*getSkillMult(state))-e.def} 伤害`,action:()=>combatPlayerTurn("skill")},{label:"服用回春丹",hint:state.inventory["回春丹"]?`剩余 ${state.inventory["回春丹"]} 颗`:"无",action:()=>combatPlayerTurn("item","回春丹")},lastChoice]});renderModal()}

function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2400)}

(function init(){loadState();render()})();
</script>
</body>
</html>
